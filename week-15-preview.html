<div class="shade" id="shade" hidden></div><aside id="drawer" class="drawer" hidden aria-label="Chapter tools"><div class="drawer-heading"><h2 id="drawerTitle"></h2><button id="closeDrawer" aria-label="Close panel">✕</button></div><div id="drawerBody"></div></aside><noscript>This illustrated book needs JavaScript. Enable it to turn the pages and use the diagrams.</noscript><script id="chapter-data">const CHAPTER={"id": "week-15", "week": 15, "kind": "main", "title": "Find the one that changes the many", "tag": "Leverage", "hook": "Find the one → fix flow → grow GP → release cash", "question": "Why compare margin and inventory turns together?", "answer": "Margin shows profit rate; turns show how often inventory capital is reused. Also examine rupee GP, ageing, demand, credit terms and risk before directing growth capital.", "blocks": [{"type": "h", "text": "Executive Summary"}, {"type": "p", "text": "Week 15 connected personal focus with business leverage. The owner was asked to stop treating every task, product, customer and problem as equally important. The 80/20 rule was applied repeatedly until 100 tasks became 20, then 4, then one decisive task. The same concentration logic was applied to products, customers, inventory, systems and time."}, {"type": "p", "text": "The operating message was equally practical: create two live FMS, build two checklists, use the Process Coordinator and S30 review, strengthen order-to-delivery, identify the bottleneck, rank products through the Great Profit Multiplier, review IMS every fifteen days, plan November in advance, meet the top 20 percent of clients, and use delegation to buy back the owner's time."}, {"type": "h", "text": "Week 15 in one page"}, {"type": "table", "headers": ["Theme", "Central question", "Week 15 operating answer"], "rows": [["80/20 Level 3", "Which work creates disproportionate results?", "Reduce 100 tasks to 20, then 4, then the one task that can create roughly half the result."], ["One Thing", "What must receive attention first?", "Choose one high-impact action in business, wealth, health and relationships; schedule it before routine work."], ["FMS and OTD", "Where is work slowing or failing?", "Make the order-to-delivery flow visible, find the constraint and improve the weakest step."], ["Profit multiplier", "Which products truly deserve growth capital?", "Read GP percentage together with rupee GP, ageing and inventory turns."], ["IMS", "Where is service or cash at risk?", "Red means availability risk; purple means excess or dead stock. Review the maximum level every fifteen days."]], "text": "Theme Central question Week 15 operating answer 80/20 Level 3 Which work creates disproportionate results? Reduce 100 tasks to 20, then 4, then the one task that can create roughly half the result. One Thing What must receive attention first? Choose one high-impact action in business, wealth, health and relationships; schedule it before routine work. FMS and OTD Where is work slowing or failing? Make the order-to-delivery flow visible, find the constraint and improve the weakest step. Profit multiplier Which products truly deserve growth capital? Read GP percentage together with rupee GP, ageing and inventory turns. IMS Where is service or cash at risk? Red means availability risk; purple means excess or dead stock. Review the maximum level every fifteen days."}, {"type": "table", "headers": ["Theme", "Central question", "Week 15 operating answer"], "rows": [["Owner leverage", "How does the owner stop being the universal doer?", "Delegate outcomes with authority, evidence and review; use EA, PC, checklists and S30."], ["Client focus", "Who deserves exceptional attention?", "Identify the top 20 percent of clients and build an AMEX-style relationship and service rhythm."]], "text": "Theme Central question Week 15 operating answer Owner leverage How does the owner stop being the universal doer? Delegate outcomes with authority, evidence and review; use EA, PC, checklists and S30. Client focus Who deserves exceptional attention? Identify the top 20 percent of clients and build an AMEX-style relationship and service rhythm."}, {"type": "p", "text": "Core conclusion The business does not improve because more tasks are attempted. It improves when the owner finds the few actions, constraints, products, customers and systems that produce most of the result - and then protects them with disciplined execution."}, {"type": "h", "text": "The Week 15 Operating Stack"}, {"type": "p", "text": "Week 15 is best understood as one management stack. Focus chooses the right work. Flow reveals delay. Profitability directs growth capital. IMS protects availability and cash. Delegation converts owner knowledge into team capacity. Planning and review keep all five alive."}, {"type": "table", "headers": ["Layer", "What it controls", "Primary owner", "Review rhythm"], "rows": [["80/20 + One Thing", "Priority and concentration of effort", "Owner / functional head", "Daily and weekly"], ["FAM + FMS", "Flow, doers, handoffs, timelines and status", "Process doers", "Live; exceptions in S30"], ["Constraint review", "The weakest step limiting total output", "Owner / MDO", "Until constraint moves"], ["GP multiplier", "Product and customer economic quality", "Owner + finance + sales", "Monthly commercial review"], ["IMS", "Availability, maximum level and working capital", "Stores / purchase / planning", "Red daily; full review every 15 days"]], "text": "Layer What it controls Primary owner Review rhythm 80/20 + One Thing Priority and concentration of effort Owner / functional head Daily and weekly FAM + FMS Flow, doers, handoffs, timelines and status Process doers Live; exceptions in S30 Constraint review The weakest step limiting total output Owner / MDO Until constraint moves GP multiplier Product and customer economic quality Owner + finance + sales Monthly commercial review IMS Availability, maximum level and working capital Stores / purchase / planning Red daily; full review every 15 days"}, {"type": "table", "headers": ["Layer", "What it controls", "Primary owner", "Review rhythm"], "rows": [["Checklists", "Recurring quality and operating standards", "Functional doer", "At the due time"], ["PC + S30", "Follow-up, evidence, exceptions and discipline", "Process Coordinator", "Daily"], ["Board / 12-week plan", "Direction, targets and strategic decisions", "Owner / leadership team", "Monthly and weekly"]], "text": "Layer What it controls Primary owner Review rhythm Checklists Recurring quality and operating standards Functional doer At the due time PC + S30 Follow-up, evidence, exceptions and discipline Process Coordinator Daily Board / 12-week plan Direction, targets and strategic decisions Owner / leadership team Monthly and weekly"}, {"type": "h", "text": "Implementation philosophy"}, {"type": "p", "text": "• Do not automate confusion. First agree the flow, owner, standard and evidence."}, {"type": "p", "text": "• Start with two useful FMS and two useful checklists; make them live before expanding the library."}, {"type": "p", "text": "• A report becomes a management system only when exceptions have owners, due dates and consequences."}, {"type": "p", "text": "• The owner should make management decisions, not repeatedly perform the doer's work."}, {"type": "p", "text": "• Use the November plan and 12-week horizon to translate insight into scheduled action."}, {"type": "h", "text": "80/20 Level 3 - From 100 Tasks to One"}, {"type": "p", "text": "The session extended Pareto thinking beyond a single 80/20 cut. The owner first lists the full universe of work, then identifies the vital 20 percent, then applies 80/20 again to those 20 tasks, and once more to the remaining four. The purpose is not mathematical precision; it is disciplined concentration."}, {"type": "table", "headers": ["Level", "Tasks retained", "Illustrative share of result", "Management meaning"], "rows": [["Starting universe", "100", "100%", "Everything currently competing for attention"], ["Level 1", "20", "About 80%", "The vital few activities"], ["Level 2", "4", "About 64%", "The highest-impact subset of the vital few"], ["Level 3", "1", "About 50%", "The decisive task to do first"]], "text": "Level Tasks retained Illustrative share of result Management meaning Starting universe 100 100% Everything currently competing for attention Level 1 20 About 80% The vital few activities Level 2 4 About 64% The highest-impact subset of the vital few Level 3 1 About 50% The decisive task to do first"}, {"type": "p", "text": "The classroom illustration separated the result contribution as approximately 50 percent from the first task, 14 percent from the next three, 16 percent from the next sixteen and only 20 percent from the final eighty. The implication is uncomfortable but valuable: eighty low-value tasks together can produce less than the one best task."}, {"type": "h", "text": "How to apply the three cuts"}, {"type": "table", "headers": ["Step", "Action", "Evidence"], "rows": [["1", "Write every meaningful task without sorting while writing", "One complete task inventory"], ["2", "Circle the top 20 by expected result, not urgency or familiarity", "Twenty tasks with a stated result"], ["3", "Reduce those 20 to the four with the greatest leverage", "Four tasks linked to measurable outcomes"], ["4", "Choose the one that makes other work easier or unnecessary", "One protected task on the calendar"], ["5", "Delegate, defer, batch, systemise or stop the remainder", "A named decision for every non-priority task"]], "text": "Step Action Evidence 1 Write every meaningful task without sorting while writing One complete task inventory 2 Circle the top 20 by expected result, not urgency or familiarity Twenty tasks with a stated result 3 Reduce those 20 to the four with the greatest leverage Four tasks linked to measurable outcomes 4 Choose the one that makes other work easier or unnecessary One protected task on the calendar 5 Delegate, defer, batch, systemise or stop the remainder A named decision for every non-priority task"}, {"type": "p", "text": "Morning question Which one task, completed today, makes everything else easier or unnecessary?"}, {"type": "h", "text": "The One Thing Across Every Chapter of Life"}, {"type": "p", "text": "The method was not limited to business. Applying focus only to business can improve numbers while allowing health, wealth discipline or relationships to deteriorate. The owner was asked to identify one decisive action in every important chapter and then protect it through scheduling."}, {"type": "table", "headers": ["Chapter", "Useful One Thing questions", "Illustrative result"], "rows": [["Business - finance", "Which pricing, collection, GP or cash action has the greatest effect?", "Release cash or improve contribution"], ["Business - operations", "Which constraint or system failure is limiting output?", "Higher OTD, capacity or quality"], ["Business - sales", "Which product, client or follow-up deserves concentrated effort?", "Higher profitable conversion"]], "text": "Chapter Useful One Thing questions Illustrative result Business - finance Which pricing, collection, GP or cash action has the greatest effect? Release cash or improve contribution Business - operations Which constraint or system failure is limiting output? Higher OTD, capacity or quality Business - sales Which product, client or follow-up deserves concentrated effort? Higher profitable conversion"}, {"type": "table", "headers": ["Chapter", "Useful One Thing questions", "Illustrative result"], "rows": [["Wealth", "Which regular investment, protection or debt action builds long- term security?", "Automated disciplined allocation"], ["Health", "Which habit has the greatest effect on energy and consistency?", "Sleep, movement, nutrition or medical follow-up"], ["Relationships", "Which conversation, gratitude practice or time commitment matters most?", "Trust, attention and connection"]], "text": "Chapter Useful One Thing questions Illustrative result Wealth Which regular investment, protection or debt action builds long- term security? Automated disciplined allocation Health Which habit has the greatest effect on energy and consistency? Sleep, movement, nutrition or medical follow-up Relationships Which conversation, gratitude practice or time commitment matters most? Trust, attention and connection"}, {"type": "h", "text": "Scheduling rule"}, {"type": "p", "text": "The One Thing should appear as a real calendar block, not a motivational intention. Protect the block before routine meetings and messages consume the day. When a task is repeatedly displaced, the calendar is revealing the true priority system."}, {"type": "p", "text": "• Define the result, not only the activity: 'approve the first live OTD FMS' is stronger than 'work on FMS'."}, {"type": "p", "text": "• Name the first physical action so that the task can begin without fresh thinking."}, {"type": "p", "text": "• Remove the most likely interruption before the block starts."}, {"type": "p", "text": "• At the end of the block, record the result, next decision and owner."}, {"type": "h", "text": "Service-Sector Order-to-Delivery and OTD"}, {"type": "p", "text": "The session reinforced that service organisations also have an order-to-delivery flow. The 'order' may be a client mandate, patient appointment, admission, legal matter, tax engagement, design brief, repair request or project award. Delivery is the promised usable outcome, not merely internal activity."}, {"type": "table", "headers": ["Service context", "Order / trigger", "Delivery definition", "Useful OTD measure"], "rows": [["CA / tax firm", "Signed engagement and complete input request", "Filed return, completed audit or accepted report", "% delivered by committed date"], ["Legal firm", "Matter accepted with scope and documents", "Filed document, opinion, hearing preparation or closure", "% milestones completed on time"], ["Doctor / clinic", "Appointment or treatment decision", "Consultation, procedure, report and follow-up completed", "Waiting time and promised follow-up compliance"], ["School / university", "Application, request or academic calendar event", "Admission, certificate, result or service completed", "Turnaround time and deadline compliance"], ["Construction / project", "Approved scope, drawing and release", "Milestone accepted against quality and time", "% milestones delivered on schedule"]], "text": "Service context Order / trigger Delivery definition Useful OTD measure CA / tax firm Signed engagement and complete input request Filed return, completed audit or accepted report % delivered by committed date Legal firm Matter accepted with scope and documents Filed document, opinion, hearing preparation or closure % milestones completed on time Doctor / clinic Appointment or treatment decision Consultation, procedure, report and follow-up completed Waiting time and promised follow-up compliance School / university Application, request or academic calendar event Admission, certificate, result or service completed Turnaround time and deadline compliance Construction / project Approved scope, drawing and release Milestone accepted against quality and time % milestones delivered on schedule"}, {"type": "h", "text": "Minimum OTD FMS steps"}, {"type": "table", "headers": ["Stage", "Control question", "Evidence"], "rows": [["Trigger", "Is the order / mandate complete enough to start?", "Approved request, scope and required inputs"], ["Plan", "Who will do what by when?", "Milestones, doers and due dates"], ["Execution", "Is work moving through the agreed sequence?", "Step status, evidence and next due date"], ["Constraint", "Which step is delaying the whole promise?", "Ageing and repeated exception data"], ["Delivery", "Has the customer received the agreed outcome?", "Acceptance, acknowledgement or closure"]], "text": "Stage Control question Evidence Trigger Is the order / mandate complete enough to start? Approved request, scope and required inputs Plan Who will do what by when? Milestones, doers and due dates Execution Is work moving through the agreed sequence? Step status, evidence and next due date Constraint Which step is delaying the whole promise? Ageing and repeated exception data Delivery Has the customer received the agreed outcome? Acceptance, acknowledgement or closure"}, {"type": "table", "headers": ["Stage", "Control question", "Evidence"], "rows": [["Learning", "What should change before the next order?", "Corrected checklist, FMS step or standard"]], "text": "Stage Control question Evidence Learning What should change before the next order? Corrected checklist, FMS step or standard"}, {"type": "h", "text": "Find and Exploit the Bottleneck"}, {"type": "p", "text": "A system's output is limited by its constraint. Improving non-constraints may create activity, local efficiency and additional inventory without improving total delivery. The operating question is therefore not 'Where is everyone busy?' but 'Which single step currently limits the promised result?'"}, {"type": "table", "headers": ["Constraint signal", "What it may indicate", "First management response"], "rows": [["Work waits longest before one step", "Capacity, approval or information bottleneck", "Measure queue age and protect constraint time"], ["Rework repeatedly returns to one department", "Quality or input-definition problem", "Fix entry criteria and error-proof the step"], ["One person approves everything", "Decision authority concentrated at the owner", "Create rules, limits and delegated authority"], ["Material repeatedly stops production", "Planning, supplier or IMS failure", "Correct red items, lead time and replenishment logic"], ["Delivery misses despite individual utilisation", "Local optimisation instead of flow", "Schedule around the system constraint"]], "text": "Constraint signal What it may indicate First management response Work waits longest before one step Capacity, approval or information bottleneck Measure queue age and protect constraint time Rework repeatedly returns to one department Quality or input-definition problem Fix entry criteria and error-proof the step One person approves everything Decision authority concentrated at the owner Create rules, limits and delegated authority Material repeatedly stops production Planning, supplier or IMS failure Correct red items, lead time and replenishment logic Delivery misses despite individual utilisation Local optimisation instead of flow Schedule around the system constraint"}, {"type": "h", "text": "Five focusing steps"}, {"type": "table", "headers": ["Step", "Management action"], "rows": [["1. Identify", "Name the current constraint using queue, delay, shortage and delivery evidence."], ["2. Exploit", "Remove avoidable idle time, interruptions, poor inputs and low-value work from the constraint."], ["3. Subordinate", "Align upstream release and downstream support to the constraint's pace."], ["4. Elevate", "Add skill, capacity, automation, supplier support or decision authority when required."], ["5. Repeat", "Once performance improves, locate the new constraint. The bottleneck will move."]], "text": "Step Management action 1. Identify Name the current constraint using queue, delay, shortage and delivery evidence. 2. Exploit Remove avoidable idle time, interruptions, poor inputs and low-value work from the constraint. 3. Subordinate Align upstream release and downstream support to the constraint's pace. 4. Elevate Add skill, capacity, automation, supplier support or decision authority when required. 5. Repeat Once performance improves, locate the new constraint. The bottleneck will move."}, {"type": "p", "text": "Constraint principle Do not optimise every department at once. Improve the step that limits total throughput, then repeat the search after the constraint moves."}, {"type": "h", "text": "FMS, Checklists, PC and the S30 Practice Loop"}, {"type": "p", "text": "The Week 15 action was deliberately small: roll out two FMS and create two checklists. The aim is not document production. The aim is to establish a repeatable implementation loop with a doer, evidence, Process Coordinator review and management decisions."}, {"type": "table", "headers": ["Tool", "Use it when", "Minimum control"], "rows": [["FMS", "Work moves through multiple doers or stages", "Trigger, unique record, step owner, due date, evidence, next step"], ["Checklist", "The same standard repeats at a time or event", "Checkpoint, frequency, doer, response, evidence, exception action"], ["PC", "Follow-up and data discipline must not depend on owner memory", "Daily exception view, polite follow-up, evidence check and escalation"], ["S30", "The team needs practice and quick decisions", "Short review of overdue work, red items, due checklists and MDO decisions"]], "text": "Tool Use it when Minimum control FMS Work moves through multiple doers or stages Trigger, unique record, step owner, due date, evidence, next step Checklist The same standard repeats at a time or event Checkpoint, frequency, doer, response, evidence, exception action PC Follow-up and data discipline must not depend on owner memory Daily exception view, polite follow-up, evidence check and escalation S30 The team needs practice and quick decisions Short review of overdue work, red items, due checklists and MDO decisions"}, {"type": "h", "text": "S-30 with MDO"}, {"type": "p", "text": "• Open only the live exception views: overdue FMS steps, red inventory items and missed checklists."}, {"type": "p", "text": "• Ask the accountable doer for the committed result and evidence; do not let PC become the universal doer."}, {"type": "p", "text": "• Record the obstacle and decide whether it requires training, authority, data, vendor action or redesign."}, {"type": "p", "text": "• MDO takes the decision that the doer or PC cannot take and records a new commitment."}, {"type": "p", "text": "• Repeated exceptions must change a checklist, rule, FMS step, authority level or training item."}, {"type": "h", "text": "Definition of a live rollout"}, {"type": "table", "headers": ["Element", "Definition of done"], "rows": [["Flow", "The actual doers agree the current process and handoffs."], ["System", "A real record has entered the FMS or checklist; it is not only a blank template."]], "text": "Element Definition of done Flow The actual doers agree the current process and handoffs. System A real record has entered the FMS or checklist; it is not only a blank template."}, {"type": "table", "headers": ["Element", "Definition of done"], "rows": [["Ownership", "Every step or checkpoint has a named doer and due-time rule."], ["Evidence", "Completion can be verified through date, number, attachment, acknowledgement or spot-check."], ["Monitoring", "PC knows which exception view to open and when."], ["Decision", "MDO is available for exceptions outside the doer's authority."]], "text": "Element Definition of done Ownership Every step or checkpoint has a named doer and due-time rule. Evidence Completion can be verified through date, number, attachment, acknowledgement or spot-check. Monitoring PC knows which exception view to open and when. Decision MDO is available for exceptions outside the doer's authority."}, {"type": "h", "text": "The Great Profit Multiplier"}, {"type": "p", "text": "Turnover alone can create a false sense of success. Gross profit percentage shows the margin rate; rupee gross profit shows the contribution generated; inventory turns show how often capital is reused; ageing shows whether stock and receivables are actually moving. Week 15 combined these measures so that growth decisions are not made from one attractive number."}, {"type": "p", "text": "Commercial memory line Turnover is vanity. Gross profit is reality. Cash conversion determines whether the profit can fund the business."}, {"type": "h", "text": "Four lenses for every product"}, {"type": "table", "headers": ["Lens", "Question", "Risk if read alone"], "rows": [["GP percentage", "How much margin is earned per unit of sales?", "A high percentage on a slow, tiny product may not create meaningful rupee GP."], ["Rupee GP", "How many gross-profit rupees does the product contribute?", "High rupee GP may still require excessive stock or poor collections."], ["Inventory turns", "How often is working capital recycled?", "Fast turns on weak GP can produce activity without adequate contribution."], ["Ageing / movement", "Is the stock or receivable moving on time?", "Reported margin cannot fund obligations while cash remains blocked."]], "text": "Lens Question Risk if read alone GP percentage How much margin is earned per unit of sales? A high percentage on a slow, tiny product may not create meaningful rupee GP. Rupee GP How many gross-profit rupees does the product contribute? High rupee GP may still require excessive stock or poor collections. Inventory turns How often is working capital recycled? Fast turns on weak GP can produce activity without adequate contribution. Ageing / movement Is the stock or receivable moving on time? Reported margin cannot fund obligations while cash remains blocked."}, {"type": "h", "text": "Illustrative capital comparison"}, {"type": "table", "headers": ["Product", "GP %", "Inventory turns", "Illustrative GP generated on Rs 100 capital"], "rows": [["A", "20%", "2x", "Rs 40"], ["B", "10%", "12x", "Rs 120"]], "text": "Product GP % Inventory turns Illustrative GP generated on Rs 100 capital A 20% 2x Rs 40 B 10% 12x Rs 120"}, {"type": "p", "text": "The example shows why margin percentage cannot be the only product-ranking method. Product B has half the margin rate but reuses capital six times faster, producing three times the illustrative gross profit on the same working capital. Real decisions must also include demand stability, credit days, risk, capacity and service requirements."}, {"type": "h", "text": "Three Product Lists for Better Decisions"}, {"type": "p", "text": "The session asked participants to create three product rankings. Each list answers a different question."}, {"type": "p", "text": "Keeping them separate prevents the business from confusing old stock, high contribution and high margin."}, {"type": "table", "headers": ["List", "Sort order", "Management use", "Typical action"], "rows": [["Ageing list", "Oldest / slowest moving first", "Reveal blocked capital and obsolescence", "Liquidate, bundle, return, transfer, recycle or stop"], ["Rupee GP list", "Highest rupee GP first", "Identify products funding the business", "Protect availability, service, capacity and sales focus"], ["GP % list", "Highest GP percentage first", "Identify attractive margin rates", "Validate volume, turns, demand and strategic fit before scaling"]], "text": "List Sort order Management use Typical action Ageing list Oldest / slowest moving first Reveal blocked capital and obsolescence Liquidate, bundle, return, transfer, recycle or stop Rupee GP list Highest rupee GP first Identify products funding the business Protect availability, service, capacity and sales focus GP % list Highest GP percentage first Identify attractive margin rates Validate volume, turns, demand and strategic fit before scaling"}, {"type": "h", "text": "Product action matrix"}, {"type": "table", "headers": ["Rupee GP", "Turns", "Likely interpretation", "Action"], "rows": [["High", "High", "Core profit engine", "Protect stock, quality, service and capacity; grow deliberately"], ["High", "Low", "Good contribution but capital-heavy", "Reduce batch size, lead time and ageing"], ["Low", "High", "Fast activity with limited contribution", "Improve price, mix or cross-sell; watch operating complexity"], ["Low", "Low", "Complexity and cash trap", "Exit, simplify, redesign or retain only for a documented strategic reason"]], "text": "Rupee GP Turns Likely interpretation Action High High Core profit engine Protect stock, quality, service and capacity; grow deliberately High Low Good contribution but capital-heavy Reduce batch size, lead time and ageing Low High Fast activity with limited contribution Improve price, mix or cross-sell; watch operating complexity Low Low Complexity and cash trap Exit, simplify, redesign or retain only for a documented strategic reason"}, {"type": "p", "text": "• Do not assume the biggest customer is the best customer; calculate customer rupee GP and payment quality."}, {"type": "p", "text": "• Link high-GP products to the clients buying them and identify cross-sell opportunities."}, {"type": "p", "text": "• Protect the constraint from low-GP work that displaces high-GP throughput."}, {"type": "p", "text": "• Review pricing, discounting, freight, rework and service cost before declaring a product attractive."}, {"type": "h", "text": "IMS - Protect Availability and Release Cash"}, {"type": "p", "text": "The Inventory Management System converts stock into an exception queue. The goal is not merely lower stock. It is lower unnecessary stock together with fewer avoidable stockouts. The red and purple disciplines protect opposite sides of the same working-capital problem."}, {"type": "table", "headers": ["Colour", "Meaning", "Immediate question", "Action owner"], "rows": [["RED", "A genuine fast-moving or required item is at availability risk", "Will service, sales or production stop before replenishment arrives?", "Stores / purchase / planning"], ["PURPLE", "Stock is materially above need or has stopped moving", "Why is cash still blocked and what is the exit decision?", "Owner + sales + stores + finance"]], "text": "Colour Meaning Immediate question Action owner RED A genuine fast-moving or required item is at availability risk Will service, sales or production stop before replenishment arrives? Stores / purchase / planning PURPLE Stock is materially above need or has stopped moving Why is cash still blocked and what is the exit decision? Owner + sales + stores + finance"}, {"type": "h", "text": "Maximum-level formula"}, {"type": "p", "text": "Formula MAXIMUM LEVEL = DAILY CONSUMPTION x ACTUAL LEAD TIME x APPROVED SAFETY FACTOR The maximum level is a management control, not an automatic purchase quantity. A purchase decision must also consider usable stock, open orders, reservations, rejected material, expected demand, minimum order quantity, supplier reliability and available cash."}, {"type": "h", "text": "Red and purple action logic"}, {"type": "table", "headers": ["Red review", "Purple review"], "rows": [["Validate repeat demand and current usable stock", "Confirm last sale / use and age bucket"], ["Check open PO, promised date and supplier reliability", "Identify return, transfer, bundle, discount, recycle or scrap route"], ["Prioritise items linked to healthy rupee GP", "Approve price / write-off authority and completion date"], ["Correct lead time, safety factor or bad master data", "Track cash actually released, not only the review decision"]], "text": "Red review Purple review Validate repeat demand and current usable stock Confirm last sale / use and age bucket Check open PO, promised date and supplier reliability Identify return, transfer, bundle, discount, recycle or scrap route Prioritise items linked to healthy rupee GP Approve price / write-off authority and completion date Correct lead time, safety factor or bad master data Track cash actually released, not only the review decision"}, {"type": "h", "text": "The Fifteen-Day IMS Review Loop"}, {"type": "p", "text": "Week 15 added a practical maintenance rhythm: review the IMS maximum levels every fifteen days. This prevents a formula created once from becoming false as demand, lead time, supplier performance, seasonality or product mix changes."}, {"type": "table", "headers": ["Review step", "Question", "Output"], "rows": [["1. Physical reality", "Does system stock match usable physical stock?", "Variance, root cause and correction"], ["2. Demand", "Has recent daily consumption increased, fallen or become erratic?", "Revised source period or daily rate"], ["3. Lead time", "What did recent actual receipts show?", "Updated lead time and vendor action"], ["4. Safety factor", "Is the current buffer still justified?", "Approved increase or decrease with reason"], ["5. Red items", "Which true fast movers threaten service or production?", "Replenishment / expedite / substitute decision"]], "text": "Review step Question Output 1. Physical reality Does system stock match usable physical stock? Variance, root cause and correction 2. Demand Has recent daily consumption increased, fallen or become erratic? Revised source period or daily rate 3. Lead time What did recent actual receipts show? Updated lead time and vendor action 4. Safety factor Is the current buffer still justified? Approved increase or decrease with reason 5. Red items Which true fast movers threaten service or production? Replenishment / expedite / substitute decision"}, {"type": "table", "headers": ["Review step", "Question", "Output"], "rows": [["6. Purple items", "Which stock has no credible consumption path?", "Named liquidation action and due date"], ["7. Turns", "Is working capital moving faster without harming service?", "Trend, exception and corrective action"]], "text": "Review step Question Output 6. Purple items Which stock has no credible consumption path? Named liquidation action and due date 7. Turns Is working capital moving faster without harming service? Trend, exception and corrective action"}, {"type": "h", "text": "Cash released from purple stock"}, {"type": "p", "text": "Cash recovered from old inventory should not disappear into uncontrolled spending. The session suggested redirecting it deliberately: replenish profitable red items, create a cash reserve, reduce expensive debt or fund a clearly approved high-return constraint improvement."}, {"type": "p", "text": "Review principle Red is a service-risk queue. Purple is a cash-release queue. Both require completed action, not only coloured cells."}, {"type": "h", "text": "Inventory Turns - The Working-Capital Measure"}, {"type": "p", "text": "Inventory turns measure how many times the average inventory investment is converted into annual sales or consumption on a consistent cost basis. The numerator and denominator must use the same valuation basis; otherwise the result is inflated and comparisons are unreliable."}, {"type": "p", "text": "Course formula INVENTORY TURNS = ANNUAL REVENUE AT RAW-MATERIAL / COST BASIS / AVERAGE INVENTORY AT THE SAME COST BASIS"}, {"type": "h", "text": "Worked illustration"}, {"type": "table", "headers": ["Input", "Value", "Meaning"], "rows": [["Annual revenue translated to RM-cost basis", "Rs 12 crore", "Consistent numerator"], ["Average inventory at RM-cost basis", "Rs 3 crore", "Average investment held"], ["Inventory turns", "4.0x", "Rs 12 crore / Rs 3 crore"]], "text": "Input Value Meaning Annual revenue translated to RM-cost basis Rs 12 crore Consistent numerator Average inventory at RM-cost basis Rs 3 crore Average investment held Inventory turns 4.0x Rs 12 crore / Rs 3 crore"}, {"type": "h", "text": "Six levers that improve turns"}, {"type": "table", "headers": ["Lever", "Practical move"], "rows": [["Reduce ageing", "Stop replenishment of slow movers; convert, bundle, discount, return or liquidate."], ["Protect fast movers", "Increase availability of products that sell quickly and create healthy rupee GP."], ["Shorten lead time", "Negotiate smaller, more frequent supply and improve internal release speed."], ["Reduce batch size", "Avoid buying or producing months of stock merely for convenience."], ["Improve demand signals", "Link pipeline, open orders and seasonal plans to purchasing decisions."]], "text": "Lever Practical move Reduce ageing Stop replenishment of slow movers; convert, bundle, discount, return or liquidate. Protect fast movers Increase availability of products that sell quickly and create healthy rupee GP. Shorten lead time Negotiate smaller, more frequent supply and improve internal release speed. Reduce batch size Avoid buying or producing months of stock merely for convenience. Improve demand signals Link pipeline, open orders and seasonal plans to purchasing decisions."}, {"type": "table", "headers": ["Lever", "Practical move"], "rows": [["Simplify range", "Remove low-GP, low-velocity complexity that consumes cash and attention."]], "text": "Lever Practical move Simplify range Remove low-GP, low-velocity complexity that consumes cash and attention."}, {"type": "p", "text": "Higher turns are valuable only when service, quality and gross profit remain healthy. Do not manufacture attractive turns through stockouts, under-buying or uneconomic discounting."}, {"type": "h", "text": "Buy Back the Owner's Time"}, {"type": "p", "text": "The owner should not solve every problem personally. The Week 15 instruction was to train the team to solve problems and to build an organisation in which information, decisions and recurring work no longer depend on one person's memory. Delegation is therefore a design discipline, not task dumping."}, {"type": "table", "headers": ["Delegation element", "What good looks like", "Failure prevented"], "rows": [["Result", "A clear outcome and definition of done", "Activity without completion"], ["Context", "Why the work matters and who is affected", "Poor local decisions"], ["Authority", "Decision limits, budget, escalation rule and access", "Every question returning to owner"], ["Method", "Checklist / FMS / example where consistency is required", "Repeated reinvention and variable quality"], ["Evidence", "Date, number, attachment, acknowledgement or spot- check", "False completion"]], "text": "Delegation element What good looks like Failure prevented Result A clear outcome and definition of done Activity without completion Context Why the work matters and who is affected Poor local decisions Authority Decision limits, budget, escalation rule and access Every question returning to owner Method Checklist / FMS / example where consistency is required Repeated reinvention and variable quality Evidence Date, number, attachment, acknowledgement or spot- check False completion"}, {"type": "table", "headers": ["Delegation element", "What good looks like", "Failure prevented"], "rows": [["Review", "A scheduled checkpoint and exception route", "Owner chasing or discovering failure too late"]], "text": "Delegation element What good looks like Failure prevented Review A scheduled checkpoint and exception route Owner chasing or discovering failure too late"}, {"type": "h", "text": "EA, PC and MDO - different roles"}, {"type": "table", "headers": ["Role", "Primary contribution", "Should not become"], "rows": [["EA", "Protect calendar, prepare information, coordinate meetings and close administrative loops", "Unclear universal assistant without priorities"]], "text": "Role Primary contribution Should not become EA Protect calendar, prepare information, coordinate meetings and close administrative loops Unclear universal assistant without priorities"}, {"type": "table", "headers": ["Role", "Primary contribution", "Should not become"], "rows": [["PC", "Monitor FMS, IMS and checklists; follow up evidence and escalate exceptions", "The doer for every overdue task"], ["MDO", "Take decisions beyond the doer's authority and remove systemic obstacles", "A replacement for routine accountability"], ["Owner", "Choose direction, constraints, capital allocation, people and standards", "The first responder to every operating issue"]], "text": "Role Primary contribution Should not become PC Monitor FMS, IMS and checklists; follow up evidence and escalate exceptions The doer for every overdue task MDO Take decisions beyond the doer's authority and remove systemic obstacles A replacement for routine accountability Owner Choose direction, constraints, capital allocation, people and standards The first responder to every operating issue"}, {"type": "p", "text": "Owner's real work The owner's job is to create economic value: choose where profit will come from, build the system and team, allocate capital and remove the constraint. Personal busyness is not the measure."}, {"type": "h", "text": "Plan November and Work in a 12-Week Horizon"}, {"type": "p", "text": "The session asked participants to plan November before it began and to read and implement The 12 Week Year. The practical shift is from annual intention to a short execution horizon with weekly leading actions, visible ownership and an honest score."}, {"type": "table", "headers": ["Planning layer", "Question", "Minimum output"], "rows": [["12-week result", "What measurable result matters by the end of the cycle?", "One to three lag outcomes"], ["Weekly bridges", "Which actions create those outcomes?", "Small set of leading actions with owners"], ["November plan", "What must happen this month in sales, profit, systems and people?", "Monthly targets, weeks, review dates and constraints"], ["Daily One Thing", "What must be done first today?", "Protected calendar block"], ["Weekly score", "What percentage of committed lead actions were completed?", "Score, explanation and recovery decision"]], "text": "Planning layer Question Minimum output 12-week result What measurable result matters by the end of the cycle? One to three lag outcomes Weekly bridges Which actions create those outcomes? Small set of leading actions with owners November plan What must happen this month in sales, profit, systems and people? Monthly targets, weeks, review dates and constraints Daily One Thing What must be done first today? Protected calendar block Weekly score What percentage of committed lead actions were completed? Score, explanation and recovery decision"}, {"type": "h", "text": "Monthly board meeting - even before a formal board"}, {"type": "p", "text": "A monthly board rhythm forces the owner to leave daily operations and examine the business as a whole. The meeting should be evidence-led, decision-led and short enough to repeat consistently."}, {"type": "table", "headers": ["Agenda", "Decision question"], "rows": [["Sales and GP", "Which products and customers created the profitable result?"], ["Cash and working capital", "Where is cash blocked in receivables, purple stock or excessive inventory?"], ["OTD and constraint", "Where did flow fail, and what is the current system bottleneck?"]], "text": "Agenda Decision question Sales and GP Which products and customers created the profitable result? Cash and working capital Where is cash blocked in receivables, purple stock or excessive inventory? OTD and constraint Where did flow fail, and what is the current system bottleneck?"}, {"type": "table", "headers": ["Agenda", "Decision question"], "rows": [["Systems", "Which FMS, IMS and checklist exceptions are repeating?"], ["People", "Where are role, skill, authority or accountability gaps?"], ["Next month", "What are the three most important decisions and the one main constraint?"]], "text": "Agenda Decision question Systems Which FMS, IMS and checklist exceptions are repeating? People Where are role, skill, authority or accountability gaps? Next month What are the three most important decisions and the one main constraint?"}, {"type": "h", "text": "Top 20 Percent Clients - AMEX-Level CRM"}, {"type": "p", "text": "The top 20 percent of clients should not be identified by turnover alone. The relationship list should consider rupee GP, payment behaviour, growth potential, strategic fit, service effort and risk. Once selected, these clients deserve a planned experience rather than occasional attention."}, {"type": "table", "headers": ["Selection factor", "Question"], "rows": [["Rupee GP", "How much gross-profit contribution did the client create?"], ["Payment quality", "Does the client pay within agreed terms and resolve disputes responsibly?"], ["Growth potential", "Can share of wallet, geography, product mix or referrals expand?"], ["Strategic fit", "Does the client strengthen capability, credibility or market access?"], ["Cost to serve", "How much special effort, rework, freight, discounting and owner time is consumed?"]], "text": "Selection factor Question Rupee GP How much gross-profit contribution did the client create? Payment quality Does the client pay within agreed terms and resolve disputes responsibly? Growth potential Can share of wallet, geography, product mix or referrals expand? Strategic fit Does the client strengthen capability, credibility or market access? Cost to serve How much special effort, rework, freight, discounting and owner time is consumed?"}, {"type": "table", "headers": ["Selection factor", "Question"], "rows": [["Risk", "Is revenue concentrated, unstable, disputed or dependent on one relationship?"]], "text": "Selection factor Question Risk Is revenue concentrated, unstable, disputed or dependent on one relationship?"}, {"type": "h", "text": "AMEX-style relationship rhythm"}, {"type": "table", "headers": ["Moment", "Experience standard", "Evidence"], "rows": [["Onboarding", "Clear contacts, expectations, timelines and escalation route", "Welcome note and account map"], ["Delivery", "Proactive updates before the client needs to ask", "OTD and exception communication"], ["Value review", "Periodic discussion of results, opportunities and avoidable friction", "Quarterly / agreed review note"], ["Recognition", "Personalised acknowledgement of important milestones and contribution", "Planned, relevant gesture"], ["Recovery", "Fast ownership of a service failure with transparent closure", "Root cause, corrective action and confirmation"]], "text": "Moment Experience standard Evidence Onboarding Clear contacts, expectations, timelines and escalation route Welcome note and account map Delivery Proactive updates before the client needs to ask OTD and exception communication Value review Periodic discussion of results, opportunities and avoidable friction Quarterly / agreed review note Recognition Personalised acknowledgement of important milestones and contribution Planned, relevant gesture Recovery Fast ownership of a service failure with transparent closure Root cause, corrective action and confirmation"}, {"type": "table", "headers": ["Moment", "Experience standard", "Evidence"], "rows": [["Growth", "Relevant ideas based on the client's needs, not generic selling", "Opportunity and next-action log"]], "text": "Moment Experience standard Evidence Growth Relevant ideas based on the client's needs, not generic selling Opportunity and next-action log"}, {"type": "p", "text": "Client principle Exceptional CRM is not expensive gifting. It is relevance, reliability, proactive communication, memory and fast recovery - delivered consistently to economically important relationships."}, {"type": "h", "text": "Week 15 Assignment - Definition of Done"}, {"type": "table", "headers": ["Priorit y", "Assignment", "Definition of done", "Monitoring"], "rows": [["P0", "Roll out 2 FMS and run S-30 with MDO", "Two real records are live; doers, due dates, evidence, PC and decision route are active", "Daily S30"], ["P0", "Create 2 checklists", "Two recurring standards are used by real doers with evidence and exception action", "At due time"], ["P0", "Attend tech class for checklist and IMS", "Learning is translated into one corrected live implementation", "Next S30"], ["P0", "Apply 80/20 Level 3 in all areas of life", "One Thing is selected and scheduled in business, wealth, health and relationships", "Daily / weekly"], ["P1", "Apply One Thing science", "The decisive task is completed before lower-value work", "Daily"]], "text": "Priorit y Assignment Definition of done Monitoring P0 Roll out 2 FMS and run S-30 with MDO Two real records are live; doers, due dates, evidence, PC and decision route are active Daily S30 P0 Create 2 checklists Two recurring standards are used by real doers with evidence and exception action At due time P0 Attend tech class for checklist and IMS Learning is translated into one corrected live implementation Next S30 P0 Apply 80/20 Level 3 in all areas of life One Thing is selected and scheduled in business, wealth, health and relationships Daily / weekly P1 Apply One Thing science The decisive task is completed before lower-value work Daily"}, {"type": "table", "headers": ["Priorit y", "Assignment", "Definition of done", "Monitoring"], "rows": [["P1", "Diwali by manifestation", "Desired experience is clarified and supported by planned action", "Personal rhythm"], ["P1", "Delegation at 4 AM", "Delegation brief prepared with result, authority, evidence and review", "Daily protected block"], ["P0", "The Great Profit Multiplier", "Three product lists completed: ageing, rupee GP and GP percentage", "Monthly commercial review"], ["P0", "Plan November", "Monthly targets, weekly bridges, owners, review dates and constraints documented", "Weekly score"], ["P1", "Start monthly board meeting", "Recurring meeting and evidence-led agenda scheduled", "Monthly"]], "text": "Priorit y Assignment Definition of done Monitoring P1 Diwali by manifestation Desired experience is clarified and supported by planned action Personal rhythm P1 Delegation at 4 AM Delegation brief prepared with result, authority, evidence and review Daily protected block P0 The Great Profit Multiplier Three product lists completed: ageing, rupee GP and GP percentage Monthly commercial review P0 Plan November Monthly targets, weekly bridges, owners, review dates and constraints documented Weekly score P1 Start monthly board meeting Recurring meeting and evidence-led agenda scheduled Monthly"}, {"type": "table", "headers": ["Priorit y", "Assignment", "Definition of done", "Monitoring"], "rows": [["P1", "Read and implement The 12 Week Year", "12-week result, weekly lead actions and scorecard created", "Weekly"], ["P1", "Meet pocket seniors", "Relevant mentors / seniors identified and purposeful meetings scheduled", "Monthly"], ["P0", "Make and maintain IMS", "Physical check, 15-day max-level review, red action, purple exit and turns calculation active", "Red daily; full review fortnightly"], ["P1", "Buy back your time", "At least one recurring owner task delegated or systemised with evidence", "Weekly"], ["P1", "Top 20% clients and AMEX CRM", "Economically important clients selected and relationship rhythm assigned", "Monthly"]], "text": "Priorit y Assignment Definition of done Monitoring P1 Read and implement The 12 Week Year 12-week result, weekly lead actions and scorecard created Weekly P1 Meet pocket seniors Relevant mentors / seniors identified and purposeful meetings scheduled Monthly P0 Make and maintain IMS Physical check, 15-day max-level review, red action, purple exit and turns calculation active Red daily; full review fortnightly P1 Buy back your time At least one recurring owner task delegated or systemised with evidence Weekly P1 Top 20% clients and AMEX CRM Economically important clients selected and relationship rhythm assigned Monthly"}, {"type": "table", "headers": ["Priorit y", "Assignment", "Definition of done", "Monitoring"], "rows": [["P2", "Enjoy Diwali", "Protected personal time is placed on the calendar", "Personal commitment"]], "text": "Priorit y Assignment Definition of done Monitoring P2 Enjoy Diwali Protected personal time is placed on the calendar Personal commitment"}, {"type": "h", "text": "Suggested seven-day implementation sprint"}, {"type": "table", "headers": ["Day", "Owner work", "Team / PC work"], "rows": [["Day 1", "Choose the two FMS, two checklists and the One Thing", "Collect current flow and recurring-task reality"], ["Day 2", "Approve triggers, doers, evidence and decision limits", "Create first live records and run them"], ["Day 3", "Complete three product rankings", "Prepare source data for ageing, rupee GP, GP% and turns"], ["Day 4", "Identify current bottleneck and protection action", "Measure queue, delay, shortage or rework at the constraint"], ["Day 5", "Approve IMS red and purple actions", "Physical check, open supply and 15-day review corrections"]], "text": "Day Owner work Team / PC work Day 1 Choose the two FMS, two checklists and the One Thing Collect current flow and recurring-task reality Day 2 Approve triggers, doers, evidence and decision limits Create first live records and run them Day 3 Complete three product rankings Prepare source data for ageing, rupee GP, GP% and turns Day 4 Identify current bottleneck and protection action Measure queue, delay, shortage or rework at the constraint Day 5 Approve IMS red and purple actions Physical check, open supply and 15-day review corrections"}, {"type": "table", "headers": ["Day", "Owner work", "Team / PC work"], "rows": [["Day 6", "Plan November and 12-week result", "Prepare weekly actions, owners and scorecard"], ["Day 7", "Select top clients and review delegation", "Prepare CRM rhythm and PC exception report"]], "text": "Day Owner work Team / PC work Day 6 Plan November and 12-week result Prepare weekly actions, owners and scorecard Day 7 Select top clients and review delegation Prepare CRM rhythm and PC exception report"}, {"type": "h", "text": "Review Templates"}, {"type": "h", "text": "Daily S30 exception agenda"}, {"type": "table", "headers": ["Sequence", "Question", "Decision / output"], "rows": [["1", "Which FMS steps are overdue or missing their trigger?", "Doer, revised commitment and escalation"], ["2", "Which checklist checkpoint failed or lacks evidence?", "Correct today and fix the system cause"], ["3", "Which genuine red inventory item threatens OTD?", "Replenish, expedite, substitute or correct data"], ["4", "What is the current flow constraint?", "Exploit, subordinate or elevate decision"], ["5", "Which issue requires MDO authority?", "Decision, owner and deadline"]], "text": "Sequence Question Decision / output 1 Which FMS steps are overdue or missing their trigger? Doer, revised commitment and escalation 2 Which checklist checkpoint failed or lacks evidence? Correct today and fix the system cause 3 Which genuine red inventory item threatens OTD? Replenish, expedite, substitute or correct data 4 What is the current flow constraint? Exploit, subordinate or elevate decision 5 Which issue requires MDO authority? Decision, owner and deadline"}, {"type": "h", "text": "Fortnightly IMS review"}, {"type": "p", "text": "• Physical-versus-system stock variance and correction."}, {"type": "p", "text": "• Top red SKUs by service risk, consumption and rupee GP."}, {"type": "p", "text": "• Purple value, oldest age, exit decision and cash actually released."}, {"type": "p", "text": "• Actual supplier lead time and safety-factor changes."}, {"type": "p", "text": "• Inventory turns trend on a consistent cost basis."}, {"type": "p", "text": "• Stockout, emergency-buying, OTD and lost-sales evidence."}, {"type": "h", "text": "Monthly commercial and board review"}, {"type": "p", "text": "• Products and clients ranked by rupee GP, GP percentage, turns and payment quality."}, {"type": "p", "text": "• High-GP, high-turn availability protected; low-GP, low-turn complexity challenged."}, {"type": "p", "text": "• Top 20 percent client relationship actions completed and next opportunities recorded."}, {"type": "p", "text": "• November / 12-week lead-action score and recovery decisions."}, {"type": "p", "text": "• Owner time released through delegation, EA, PC, FMS and checklists."}, {"type": "p", "text": "• The next constraint and the one management decision required to move it."}, {"type": "h", "text": "Master Action Checklist"}, {"type": "h", "text": "Immediate"}, {"type": "p", "text": "[ ] Select the two FMS and two checklists that will go live first."}, {"type": "p", "text": "[ ] Apply 80/20 three times and calendar the one decisive task."}, {"type": "p", "text": "[ ] Identify the current order-to-delivery constraint using evidence."}, {"type": "p", "text": "[ ] Create the ageing, rupee-GP and GP-percentage product lists."}, {"type": "p", "text": "[ ] Complete a physical stock check for the most important inventory locations."}, {"type": "p", "text": "[ ] Validate genuine red items and create owners and due dates."}, {"type": "p", "text": "[ ] Identify purple stock and approve an exit route."}, {"type": "h", "text": "This week"}, {"type": "p", "text": "[ ] Run daily S30 with PC and MDO for live exceptions."}, {"type": "p", "text": "[ ] Calculate inventory turns on a consistent cost basis."}, {"type": "p", "text": "[ ] Prepare the November plan and first 12-week scorecard."}, {"type": "p", "text": "[ ] Schedule the monthly board meeting and use the standard agenda."}, {"type": "p", "text": "[ ] Choose the top 20 percent of clients using economic and relationship quality."}, {"type": "p", "text": "[ ] Create the first AMEX-style client contact and value-review rhythm."}, {"type": "p", "text": "[ ] Delegate one recurring owner task with result, authority, evidence and review."}, {"type": "h", "text": "Ongoing"}, {"type": "p", "text": "[ ] Review IMS maximum levels every fifteen days and document every change."}, {"type": "p", "text": "[ ] Protect high-GP, high-turn products and remove low-value complexity."}, {"type": "p", "text": "[ ] Repeat the constraint cycle whenever the bottleneck moves."}, {"type": "p", "text": "[ ] Improve FMS and checklists from real exceptions, not imagined completeness."}, {"type": "p", "text": "[ ] Track whether delegation is truly releasing owner time."}, {"type": "p", "text": "[ ] Review the One Thing across business, wealth, health and relationships every week."}, {"type": "h", "text": "Glossary"}, {"type": "table", "headers": ["Term", "Meaning in this guide"], "rows": [["80/20 Level 3", "Repeated Pareto cuts that reduce a large task universe to the one highest-leverage action"], ["One Thing", "The action that makes other work easier or unnecessary"], ["FAM", "Flowchart Alignment Meeting"], ["FMS", "Flow Management System"], ["OTD", "Order-to-delivery flow and / or on-time delivery performance"]], "text": "Term Meaning in this guide 80/20 Level 3 Repeated Pareto cuts that reduce a large task universe to the one highest-leverage action One Thing The action that makes other work easier or unnecessary FAM Flowchart Alignment Meeting FMS Flow Management System OTD Order-to-delivery flow and / or on-time delivery performance"}, {"type": "table", "headers": ["Term", "Meaning in this guide"], "rows": [["Constraint", "The step currently limiting total system output"], ["IMS", "Inventory Management System"], ["Inventory turns", "How often average inventory investment is recycled over a period on a consistent cost basis"], ["Rupee GP", "Gross-profit rupees contributed by a product or customer"], ["Red", "Genuine fast-moving / required inventory at availability risk"]], "text": "Term Meaning in this guide Constraint The step currently limiting total system output IMS Inventory Management System Inventory turns How often average inventory investment is recycled over a period on a consistent cost basis Rupee GP Gross-profit rupees contributed by a product or customer Red Genuine fast-moving / required inventory at availability risk"}, {"type": "table", "headers": ["Term", "Meaning in this guide"], "rows": [["Purple", "Excess, dead or non-moving inventory blocking working capital"], ["PC", "Process Coordinator"], ["S30", "Short recurring review of live exceptions and implementation practice"], ["MDO", "Management Decision Owner who resolves exceptions beyond the doer's authority"], ["AMEX CRM", "A deliberate high-service relationship rhythm for economically important clients"]], "text": "Term Meaning in this guide Purple Excess, dead or non-moving inventory blocking working capital PC Process Coordinator S30 Short recurring review of live exceptions and implementation practice MDO Management Decision Owner who resolves exceptions beyond the doer's authority AMEX CRM A deliberate high-service relationship rhythm for economically important clients"}, {"type": "p", "text": "Final memory line Find the one. Fix the constraint. Protect the profit engines. Release blocked cash. Build the team and systems that buy back the owner's time."}, {"type": "h", "text": "Companion practice notes"}, {"type": "h", "text": "The Week 15 Story in One View"}, {"type": "p", "text": "Week 15 connected personal focus, operating discipline and working-capital productivity into one management system."}, {"type": "h", "text": "02 03"}, {"type": "p", "text": "Choose the vital few Protect the flow Multiply the same capital Apply 80/20 repeatedly until one task Map order-to-delivery, measure Read products through GP becomes the priority. Build a One on-time delivery, identify the percentage, rupee GP, ageing and Thing for business, health, wealth and bottleneck, launch critical FMSs and inventory turns. Move cash from dead relationships. create checklists. stock into productive uses."}, {"type": "h", "text": "The operating logic"}, {"type": "table", "headers": ["Question", "Week 15 answer", "Management output"], "rows": [["What deserves attention?", "80/20 Level 3 and One Thing", "A ranked list and one protected priority"], ["Where does work slow down?", "Theory of Constraints and bottleneck FMS", "A measurable constraint with an owner"], ["Why is cash stuck?", "IMS, ageing, GP and inventory turns", "Less excess stock and more productive capital"], ["How does execution continue?", "S-30, MDO review, checklists and delegation", "A repeatable review rhythm"]], "text": "Question Week 15 answer Management output What deserves attention? 80/20 Level 3 and One Thing A ranked list and one protected priority Where does work slow down? Theory of Constraints and bottleneck FMS A measurable constraint with an owner Why is cash stuck? IMS, ageing, GP and inventory turns Less excess stock and more productive capital How does execution continue? S-30, MDO review, checklists and delegation A repeatable review rhythm"}, {"type": "p", "text": "Core thesis Growth is not only about adding people, stock or capital. First concentrate effort, then remove the constraint, and finally rotate the same resources faster."}, {"type": "h", "text": "The 80/20 of the Course So Far"}, {"type": "p", "text": "The session identified nine systems that convert owner-led firefighting into a managed operating rhythm."}, {"type": "h", "text": "2 3"}, {"type": "p", "text": "FMS + S-30 IMS Bottleneck Launch two critical flows and review Control availability, excess stock and Find the constraint that limits total them with the people doing the work. inventory turns. throughput."}, {"type": "h", "text": "5 6"}, {"type": "p", "text": "Checklists EM + Delegation Profit by product Move repetitive quality control from Move coordination and follow-up away Use GP, ageing and turns to decide memory to a visible standard. from the owner's head. where capital belongs."}, {"type": "h", "text": "8 9"}, {"type": "p", "text": "Creation hour Weekly scheduling Monthly HCI Use protected early-morning time for Convert priorities into time blocks and Run a regular management review difficult design work. owner commitments. instead of waiting for a crisis."}, {"type": "p", "text": "Week 15 question Which two or three of these systems, if implemented properly now, would remove the biggest recurring constraint in the business?"}, {"type": "h", "text": "80/20 Level 3: From 100 Tasks to One"}, {"type": "p", "text": "The course applies Pareto thinking repeatedly. The purpose is not to ignore work; it is to protect the task that creates disproportionate movement."}, {"type": "h", "text": "100"}, {"type": "p", "text": "All visible tasks ~100% result"}, {"type": "h", "text": "20"}, {"type": "p", "text": "Level 1 - vital twenty ~80% result"}, {"type": "h", "text": "4"}, {"type": "p", "text": "Level 2 - critical four ~64% result"}, {"type": "h", "text": "1"}, {"type": "p", "text": "Lev~e5l0 3% - r ethsuelt One Thing"}, {"type": "h", "text": "How to apply it"}, {"type": "p", "text": "1 2 3 4 5 List Select 20% Select again Choose one Rebuild Write all current tasks Circle the highest-impact Reduce that list to the Do the highest-impact After completion, rewrite without editing. work. critical few. task first. the remaining list."}, {"type": "p", "text": "Important distinction The percentages are a prioritisation model, not a mathematical promise. Use the funnel to force choices, then verify the result through data and review."}, {"type": "h", "text": "The One Thing: A Living Priority"}, {"type": "p", "text": "A One Thing is the single outcome receiving concentrated attention now. It changes when the current outcome is completed or no longer remains the constraint."}, {"type": "p", "text": "BUSINESS WEALTH Example: build a defined Example: order-to-delivery reliability passive-income corpus"}, {"type": "h", "text": "ONE"}, {"type": "h", "text": "THING"}, {"type": "p", "text": "HEALTH RELATIONSHIP Example: reduce weight or build Example: rebuild protected time and strength trust"}, {"type": "table", "headers": ["Time horizon", "Question"], "rows": [["Today", "Which one task, completed today, makes the rest easier or unnecessary?"], ["This week", "Which result must move before the weekly review?"], ["This month", "Which system or bottleneck deserves a protected implementation block?"], ["This quarter", "Which business outcome changes capacity, cash or owner freedom?"]], "text": "Time horizon Question Today Which one task, completed today, makes the rest easier or unnecessary? This week Which result must move before the weekly review? This month Which system or bottleneck deserves a protected implementation block? This quarter Which business outcome changes capacity, cash or owner freedom?"}, {"type": "p", "text": "Operating rule Schedule the One Thing before routine work. If every task is labelled important, the prioritisation exercise has not been completed."}, {"type": "h", "text": "Service Sector: Make On-Time Delivery the One Thing"}, {"type": "p", "text": "In a service business, inventory is often not the primary constraint. Capacity, coordination and top-management time become the scarce resources."}, {"type": "p", "text": "Order Scope and Plan and Execute and Deliver and accepted commitment assign quality check close CORE METRIC"}, {"type": "h", "text": "OTD % = On-time deliveries / Total deliveries due x 100"}, {"type": "p", "text": "Level 1 target discussed in the session: 80% on-time delivery."}, {"type": "table", "headers": ["Build", "Management question", "Output"], "rows": [["Order-to-delivery FMS", "Where does every live job stand?", "Visible stage, owner, due date and escalation"], ["Critical FMSs", "Which 2-5 processes determine most service reliability?", "Priority flows built before noncritical ones"], ["Checklists", "Which recurring errors can be prevented?", "Standard completion and quality evidence"], ["Bottleneck review", "Which step limits total completion today?", "Constraint owner and improvement experiment"]], "text": "Build Management question Output Order-to-delivery FMS Where does every live job stand? Visible stage, owner, due date and escalation Critical FMSs Which 2-5 processes determine most service reliability? Priority flows built before noncritical ones Checklists Which recurring errors can be prevented? Standard completion and quality evidence Bottleneck review Which step limits total completion today? Constraint owner and improvement experiment"}, {"type": "p", "text": "Service-sector principle Do not optimise every department independently. Improve the step that controls the rate at which the entire order-to-delivery system finishes work."}, {"type": "h", "text": "Theory of Constraints: Improve the System Through Its Bottleneck"}, {"type": "p", "text": "The session used the Theory of Constraints as the thinking model for manufacturing, projects, retail and services."}, {"type": "p", "text": "1. Identify Find the step limiting total flow."}, {"type": "p", "text": "5. Repeat 2. Exploit When it moves, find the new Use the constraint well; remove constraint. avoidable idle time."}, {"type": "p", "text": "THROUGHPUT of the whole system"}, {"type": "p", "text": "4. Elevate 3. Subordinate Add capacity only when the constraint Align upstream and downstream work is truly saturated. to it."}, {"type": "table", "headers": ["Business type", "Constraint lens", "Course reference"], "rows": [["Manufacturing", "Machine, process, material or scheduling capacity", "The Goal"], ["Projects", "Critical chain, resource contention and completion reliability", "Critical Chain"], ["Retail / trading", "Availability, excess stock and slow inventory rotation", "Isn't It Obvious?"], ["Services", "Specialist time, coordination and order-to-delivery reliability", "Order-to-delivery FMS"]], "text": "Business type Constraint lens Course reference Manufacturing Machine, process, material or scheduling capacity The Goal Projects Critical chain, resource contention and completion reliability Critical Chain Retail / trading Availability, excess stock and slow inventory rotation Isn't It Obvious? Services Specialist time, coordination and order-to-delivery reliability Order-to-delivery FMS"}, {"type": "p", "text": "Avoid the common trap A ready-made solution can hide the real constraint. Observe the actual workflow, ask the team doing the work, and test improvement with the system's output metric."}, {"type": "h", "text": "The Great Profit Multiplier"}, {"type": "p", "text": "A high margin does not automatically make a product superior. The session combined margin, rupee contribution, demand and speed of rotation."}, {"type": "p", "text": "GP percentage Rupee GP Capital productivity"}, {"type": "h", "text": "GP / Sales Sales x GP % GP % x Turns"}, {"type": "p", "text": "How much margin is earned on each How many gross-profit rupees does the How much gross profit can the same rupee of sales? product contribute? inventory capital generate in a year?"}, {"type": "h", "text": "Why rotation changes the decision"}, {"type": "table", "headers": ["Product", "Cost capital", "GP %", "Annual turns", "Illustrative annual GP", "Decision"], "rows": [["A - high margin, slow", "Rs 100", "20%", "2", "Rs 40", "Looks attractive until speed is considered"], ["B - lower margin, fast", "Rs 100", "10%", "12", "Rs 120", "Same capital can contribute three times more"]], "text": "Product Cost capital GP % Annual turns Illustrative annual GP Decision A - high margin, slow Rs 100 20% 2 Rs 40 Looks attractive until speed is considered B - lower margin, fast Rs 100 10% 12 Rs 120 Same capital can contribute three times more"}, {"type": "p", "text": "THE DECISION EQUATION"}, {"type": "h", "text": "Demand x GP% x Rupee GP x Inventory Turns x Ease of fulfilment"}, {"type": "p", "text": "The lesson Do not chase turnover or margin in isolation. Put limited capital and limited capacity behind products that create healthy gross profit and return the capital quickly."}, {"type": "h", "text": "Three Product Lists That Change Decisions"}, {"type": "p", "text": "The assignment converts the GP sheet into three ranked views. The lists should be built separately because each answers a different question."}, {"type": "table", "headers": ["List", "Sort order", "Question answered", "Management response"], "rows": [["1. Ageing", "Ascending days", "Which products release capital fastest?", "Protect availability of fast movers; investigate slow movers"], ["2. Rupee GP", "Descending Rs GP", "Which products contribute the most gross-profit rupees?", "Strengthen sales, service and capacity around meaningful contributors"], ["3. GP %", "Descending GP %", "Which products have the strongest unit economics?", "Check whether margin survives after volume, ageing and turns"]], "text": "List Sort order Question answered Management response 1. Ageing Ascending days Which products release capital fastest? Protect availability of fast movers; investigate slow movers 2. Rupee GP Descending Rs GP Which products contribute the most gross-profit rupees? Strengthen sales, service and capacity around meaningful contributors 3. GP % Descending GP % Which products have the strongest unit economics? Check whether margin survives after volume, ageing and turns"}, {"type": "h", "text": "The product action matrix"}, {"type": "table", "headers": ["HIGH GP / SLOW Fix ageing, price or demand before adding stock.", "HIGH GP / FAST Protect availability and scale deliberately."], "rows": [["LOW GP / SLOW Stop, liquidate, redesign or remove.", "LOW GP / FAST Improve margin without harming velocity."]], "text": "HIGH GP / SLOW Fix ageing, price or demand before adding stock. HIGH GP / FAST Protect availability and scale deliberately. LOW GP / SLOW Stop, liquidate, redesign or remove. LOW GP / FAST Improve margin without harming velocity."}, {"type": "p", "text": "hgih >- wol :ytilauq tiforp-ssorG Inventory velocity: slow -> fast Implementation discipline Use a consistent period and product definition. Start with broad batches, then drill down only where the first analysis points to a meaningful decision."}, {"type": "h", "text": "IMS: Availability Without Cash Blockage"}, {"type": "p", "text": "The Inventory Management System balances two losses: a lost sale caused by shortage and locked cash caused by excess stock."}, {"type": "h", "text": "Working maximum level"}, {"type": "h", "text": "Daily consumption x Lead time x Safety factor"}, {"type": "p", "text": "Review consumption, lead time and safety-factor assumptions every 15 days."}, {"type": "table", "headers": ["Colour", "Meaning", "Risk", "Immediate response"], "rows": [["PURPLE", "Above maximum / excess", "Cash blocked, ageing and debt pressure", "Pause purchase; reduce safety factor/max; liquidate dead stock"], ["GREEN", "Healthy operating range", "Low", "Maintain and monitor"], ["YELLOW", "Approaching shortage", "Service risk rising", "Verify lead time and incoming supply"], ["RED", "Danger level", "Lost sale and lost customer", "Reorder urgently; investigate recurring shortage"], ["BLACK", "Stock-out", "Demand cannot be served", "Escalate recovery and root cause"]], "text": "Colour Meaning Risk Immediate response PURPLE Above maximum / excess Cash blocked, ageing and debt pressure Pause purchase; reduce safety factor/max; liquidate dead stock GREEN Healthy operating range Low Maintain and monitor YELLOW Approaching shortage Service risk rising Verify lead time and incoming supply RED Danger level Lost sale and lost customer Reorder urgently; investigate recurring shortage BLACK Stock-out Demand cannot be served Escalate recovery and root cause"}, {"type": "h", "text": "Build the baseline correctly"}, {"type": "p", "text": "Run a physical stock check; the session recommended an external audit over the first three months."}, {"type": "p", "text": "Use actual consumption and actual replenishment lead time instead of memory or optimism."}, {"type": "p", "text": "Begin with a reasonable safety factor, then change it from evidence produced by red and purple items."}, {"type": "p", "text": "Track raw material, work-in-progress and finished goods separately where their risks differ."}, {"type": "p", "text": "Course phrase translated into management language 'Red is paap' means a preventable red item is not a harmless colour. It signals demand that may be lost because a saleable item is unavailable."}, {"type": "h", "text": "The 15-Day IMS Control Loop"}, {"type": "p", "text": "IMS is not a one-time spreadsheet. It becomes useful only when the team reviews exceptions, changes assumptions and tracks the result."}, {"type": "p", "text": "1. Count Update physical stock and open orders."}, {"type": "p", "text": "6. Review 2. Colour Check whether the colour moves in Compare stock with max and danger the next cycle. levels."}, {"type": "p", "text": "EVERY 15 DAYS"}, {"type": "p", "text": "5. Act 3. Explain Reorder red, stop purple and assign Find the reason for red or purple disposal actions. exceptions."}, {"type": "p", "text": "4. Adjust Change safety factor / max level only with a reason."}, {"type": "table", "headers": ["If the item is...", "Change", "Guardrail"], "rows": [["Repeatedly red", "Increase safety factor / maximum level, or reduce lead time", "Confirm demand is real and not a data or ordering error"], ["Repeatedly purple", "Decrease safety factor / maximum level and stop replenishment", "Create a disposal plan instead of waiting indefinitely"], ["Frequently switching colours", "Investigate volatile demand, batch size and unreliable lead time", "Do not react by blindly inflating every maximum level"]], "text": "If the item is... Change Guardrail Repeatedly red Increase safety factor / maximum level, or reduce lead time Confirm demand is real and not a data or ordering error Repeatedly purple Decrease safety factor / maximum level and stop replenishment Create a disposal plan instead of waiting indefinitely Frequently switching colours Investigate volatile demand, batch size and unreliable lead time Do not react by blindly inflating every maximum level"}, {"type": "p", "text": "The science inside 'gut feel' The initial safety factor may begin as judgement. The discipline is to revise it every review cycle using colour history, consumption, lead time and actual service loss."}, {"type": "h", "text": "Inventory Turns: The Working-Capital Game Changer"}, {"type": "p", "text": "Inventory turns measure how many times the average inventory investment is converted into annual sales on a consistent cost basis."}, {"type": "p", "text": "COURSE FORMULA"}, {"type": "h", "text": "Inventory Turns ="}, {"type": "h", "text": "Annual Revenue at RM Cost / Average Inventory at RM Cost"}, {"type": "p", "text": "Use the same valuation basis in numerator and denominator; exclude GST and selling-price inflation."}, {"type": "h", "text": "Rs 12 Cr Rs 3 Cr 4.0x"}, {"type": "p", "text": "Annual revenue translated to RM-cost basis Average inventory at RM cost Illustrative annual inventory turns"}, {"type": "h", "text": "Six levers that improve turns"}, {"type": "table", "headers": ["Lever", "Practical move"], "rows": [["Reduce ageing", "Stop replenishment of slow movers; convert, bundle, discount or liquidate them."], ["Protect fast movers", "Increase availability of products that sell quickly and contribute healthy GP."], ["Shorten lead time", "Negotiate smaller, more frequent supply and improve internal release speed."], ["Reduce batch size", "Avoid buying or producing months of stock merely for convenience."], ["Improve demand signals", "Link sales pipeline, open orders and seasonal plans to purchase decisions."]], "text": "Lever Practical move Reduce ageing Stop replenishment of slow movers; convert, bundle, discount or liquidate them. Protect fast movers Increase availability of products that sell quickly and contribute healthy GP. Shorten lead time Negotiate smaller, more frequent supply and improve internal release speed. Reduce batch size Avoid buying or producing months of stock merely for convenience. Improve demand signals Link sales pipeline, open orders and seasonal plans to purchase decisions."}, {"type": "table", "headers": ["Lever", "Practical move"], "rows": [["Simplify range", "Remove low-GP, low-velocity complexity that consumes cash and attention."]], "text": "Lever Practical move Simplify range Remove low-GP, low-velocity complexity that consumes cash and attention."}, {"type": "p", "text": "Management caution Higher turns are valuable only when service, quality and gross profit remain healthy. Do not create artificial turns by stock-outs or uneconomic discounting."}, {"type": "h", "text": "Buy Back the Owner's Time"}, {"type": "p", "text": "Week 15 linked focus to delegation: the owner designs the system, the team executes it, and a review rhythm closes the loop."}, {"type": "p", "text": "DESIGN Owner identifies the One Thing, bottleneck and expected outcome."}, {"type": "p", "text": "BUILD Create FM

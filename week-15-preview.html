S, checklist and responsibility map."}, {"type": "p", "text": "LAUNCH Run S-30 with doers and the MDO review group."}, {"type": "p", "text": "DELEGATE EA / coordinator follows commitments and exceptions."}, {"type": "p", "text": "GOVERN Owner reviews data, constraints and decisions - not every task."}, {"type": "table", "headers": ["Practice", "Use", "Avoid"], "rows": [["S-30 with MDO", "Fast feedback from the PC and actual doers", "Reviewing the sheet without the people executing it"], ["Two checklists", "Start with recurring, quality-sensitive work", "Writing encyclopaedias that nobody uses"], ["EA / executive support", "Scheduling, follow-up, call handling and delegation tracking", "Turning the EA into one senior's private assistant"], ["Protected creation hour", "Build FMSs, checklists and difficult analysis without interruption", "Using the entire session for ritual while hard work remains untouched"]], "text": "Practice Use Avoid S-30 with MDO Fast feedback from the PC and actual doers Reviewing the sheet without the people executing it Two checklists Start with recurring, quality-sensitive work Writing encyclopaedias that nobody uses EA / executive support Scheduling, follow-up, call handling and delegation tracking Turning the EA into one senior's private assistant Protected creation hour Build FMSs, checklists and difficult analysis without interruption Using the entire session for ritual while hard work remains untouched"}, {"type": "p", "text": "DDD rule For every remaining task decide: Do, Delegate or Delete. Defer only with a real date and reason; otherwise it becomes disguised avoidance."}, {"type": "h", "text": "Plan November Like a 12-Week Year"}, {"type": "p", "text": "The session emphasised implementation, not merely reading. A compressed planning horizon accelerates decisions and exposes weak follow-through."}, {"type": "p", "text": "WEEK 1 WEEK 2 WEEK 3 WEEK 4 Baseline Launch Correct Govern Audit stock, list One Things, Run S-30, start IMS review Review OTD, bottlenecks, Hold the out-of-office board choose two FMSs and two and assign product-list red/purple inventory and meeting and lock the next checklists. owners. action slippage. cycle."}, {"type": "h", "text": "Monthly out-of-office board meeting"}, {"type": "table", "headers": ["Agenda block", "Question", "Decision / output"], "rows": [["Results", "What moved in sales, GP, cash, OTD and turns?", "One-page scorecard"], ["Constraint", "What limited the system this month?", "Named bottleneck and experiment"], ["Customers", "What failed for the top clients?", "Service recovery and CRM plan"], ["People", "Where is the owner still the process?", "Delegation / capability action"], ["Next month", "What are the three outcomes that matter most?", "Calendar blocks, owners and dates"]], "text": "Agenda block Question Decision / output Results What moved in sales, GP, cash, OTD and turns? One-page scorecard Constraint What limited the system this month? Named bottleneck and experiment Customers What failed for the top clients? Service recovery and CRM plan People Where is the owner still the process? Delegation / capability action Next month What are the three outcomes that matter most? Calendar blocks, owners and dates"}, {"type": "p", "text": "Why out of office?"}, {"type": "p", "text": "A different physical setting can help the team step out of operational noise and discuss the business as owners and governors rather than as firefighters."}, {"type": "h", "text": "Top 20% Clients Deserve Amex-Level CRM"}, {"type": "p", "text": "The session highlighted a painful pattern: the biggest or most profitable clients may receive the poorest service because the team assumes the relationship is secure."}, {"type": "p", "text": "ALL ACTIVE CLIENTS Build a clean client-profit and service baseline TOP 20% BY RUPEE GP Identify the clients creating most gross-profit rupees PRIORITY RELATIONSHIPS Protect service, retention and expansion AMEX CRM High-touch ownership"}, {"type": "h", "text": "Priority-client service audit"}, {"type": "table", "headers": ["Dimension", "Evidence to review", "Standard"], "rows": [["Delivery", "Promised vs actual date; open delays", "Proactive updates before the client asks"], ["Quality", "Complaints, rework, returns and repeat failures", "Closed-loop root cause and prevention"], ["Communication", "Response time, clarity and ownership", "One relationship owner; visible escalation"], ["Commercial", "Rupee GP, payment pattern and growth potential", "Win-win growth, not unmanaged discounting"], ["Experience", "Moments that create friction or delight", "Personalised, reliable, memorable service"]], "text": "Dimension Evidence to review Standard Delivery Promised vs actual date; open delays Proactive updates before the client asks Quality Complaints, rework, returns and repeat failures Closed-loop root cause and prevention Communication Response time, clarity and ownership One relationship owner; visible escalation Commercial Rupee GP, payment pattern and growth potential Win-win growth, not unmanaged discounting Experience Moments that create friction or delight Personalised, reliable, memorable service"}, {"type": "p", "text": "Do not confuse size with quality Rank clients by rupee GP, strategic fit, payment behaviour and service cost. A high-turnover client can still be a weak relationship if margin or payment discipline is poor."}, {"type": "h", "text": "Week 15 Assignment - Complete Action Register"}, {"type": "p", "text": "The original sixteen actions are grouped below into four implementation workstreams so ownership and review become easier."}, {"type": "p", "text": "SYSTEMS AND FLOW FOCUS AND OWNER TIME"}, {"type": "p", "text": "1. Roll out 2 FMSs and S-30 with MDO. 4. Apply 80/20 Level 3 in all areas of life."}, {"type": "p", "text": "2. Create 2 checklists. 5. Apply One Thing science."}, {"type": "p", "text": "3. Attend the tech class for checklist and IMS. 7. Use the 4 AM creation block for difficult work and delegation."}, {"type": "p", "text": "13. Build the IMS: physical count, 15-day max review, red urgency, purple disposal and turns. 14. Buy back your time."}, {"type": "p", "text": "PROFIT AND CLIENTS GOVERNANCE AND GROWTH"}, {"type": "p", "text": "8. Build the Great Profit Multiplier: ageing ascending, Rs 9. Plan November."}, {"type": "p", "text": "GP descending, GP% descending."}, {"type": "p", "text": "10. Start a monthly out-of-office board meeting."}, {"type": "p", "text": "15. Identify the top 20% clients and give them Amex-level CRM. 11. Read and implement The 12 Week Year."}, {"type": "p", "text": "6. Set and execute the Diwali manifestation target with a 12. Meet Rockstar Seniors who have measurable results."}, {"type": "p", "text": "concrete action plan."}, {"type": "p", "text": "16. Enjoy Diwali - protect the life the business is meant to support."}, {"type": "p", "text": "Completion standard An action is not complete because a sheet exists. Completion requires an owner, live data, a review date, evidence of use and a decision taken from the output."}, {"type": "h", "text": "30-Day Week 15 Implementation Sprint"}, {"type": "p", "text": "The sprint sequences the work so that focus, flow and cash improve together rather than becoming disconnected spreadsheets."}, {"type": "table", "headers": ["Week", "Focus", "Deliverables", "Review evidence"], "rows": [["1", "Baseline and focus", "100-task list -> 20 -> 4 -> 1; choose 2 FMSs; physical stock audit plan", "One Thing blocked in calendar; baseline OTD / stock exceptions"], ["2", "Launch systems", "Launch FMS S-30; publish 2 checklists; build first IMS; prepare 3 product rankings", "Doer feedback; red/purple list; GP and ageing exceptions"], ["3", "Correct the constraint", "Run first 15-day IMS review; assign bottleneck experiment; create priority-client recovery plan", "Changed max levels with reasons; OTD movement; client actions"], ["4", "Govern and repeat", "OOO board meeting; November scorecard; next 12-week commitments; delegation reset", "Signed decisions, owners, dates and next review"]], "text": "Week Focus Deliverables Review evidence 1 Baseline and focus 100-task list -> 20 -> 4 -> 1; choose 2 FMSs; physical stock audit plan One Thing blocked in calendar; baseline OTD / stock exceptions 2 Launch systems Launch FMS S-30; publish 2 checklists; build first IMS; prepare 3 product rankings Doer feedback; red/purple list; GP and ageing exceptions 3 Correct the constraint Run first 15-day IMS review; assign bottleneck experiment; create priority-client recovery plan Changed max levels with reasons; OTD movement; client actions 4 Govern and repeat OOO board meeting; November scorecard; next 12-week commitments; delegation reset Signed decisions, owners, dates and next review"}, {"type": "h", "text": "Owner dashboard"}, {"type": "table", "headers": ["Metric", "Baseline", "30-day target", "Frequency"], "rows": [["On-time delivery", "____ %", "____ %", "Weekly"], ["Red SKU count", "____", "____", "Every 15 days"], ["Purple / dead stock value", "Rs ____", "Rs ____", "Every 15 days"], ["Inventory turns", "____ x", "____ x", "Monthly"], ["Rupee GP from top products", "Rs ____", "Rs ____", "Monthly"]], "text": "Metric Baseline 30-day target Frequency On-time delivery ____ % ____ % Weekly Red SKU count ____ ____ Every 15 days Purple / dead stock value Rs ____ Rs ____ Every 15 days Inventory turns ____ x ____ x Monthly Rupee GP from top products Rs ____ Rs ____ Monthly"}, {"type": "table", "headers": ["Metric", "Baseline", "30-day target", "Frequency"], "rows": [["Owner hours released", "____", "____", "Weekly"], ["Priority-client open failures", "____", "____", "Weekly"]], "text": "Metric Baseline 30-day target Frequency Owner hours released ____ ____ Weekly Priority-client open failures ____ ____ Weekly"}, {"type": "p", "text": "Review question Did the system improve the business metric, or did the team merely complete a document? Keep only the"}, {"type": "h", "text": "Week 15 Final Master Checklist"}, {"type": "p", "text": "Use this page at the monthly board meeting. Every row should have evidence, an owner and a next review date."}, {"type": "table", "headers": ["Area", "Completion test"], "rows": [["80/20 Level 3", "One priority is selected from a written list; it has protected calendar time."], ["One Thing", "Business, wealth, health and relationship priorities are explicit; only active priorities are tracked."], ["FMS", "Two critical FMSs are live with actual doers, owners, dates and S-30 review."], ["Checklists", "Two recurring processes have short, usable checklists with evidence of use."], ["Bottleneck", "The current constraint is named and connected to a throughput / OTD metric."]], "text": "Area Completion test 80/20 Level 3 One priority is selected from a written list; it has protected calendar time. One Thing Business, wealth, health and relationship priorities are explicit; only active priorities are tracked. FMS Two critical FMSs are live with actual doers, owners, dates and S-30 review. Checklists Two recurring processes have short, usable checklists with evidence of use. Bottleneck The current constraint is named and connected to a throughput / OTD metric."}, {"type": "table", "headers": ["Area", "Completion test"], "rows": [["Service OTD", "Promised and actual delivery dates are captured; OTD is reviewed weekly."], ["GP multiplier", "Ageing, Rs GP and GP% lists exist and produce product actions."], ["IMS", "Physical count is planned; red/purple exceptions are reviewed every 15 days."], ["Inventory turns", "Turns are calculated on a consistent RM-cost basis and monitored by category."], ["Dead stock cash", "Disposal proceeds are ring-fenced for red stock, cash reserve or debt reduction."]], "text": "Area Completion test Service OTD Promised and actual delivery dates are captured; OTD is reviewed weekly. GP multiplier Ageing, Rs GP and GP% lists exist and produce product actions. IMS Physical count is planned; red/purple exceptions are reviewed every 15 days. Inventory turns Turns are calculated on a consistent RM-cost basis and monitored by category. Dead stock cash Disposal proceeds are ring-fenced for red stock, cash reserve or debt reduction."}, {"type": "table", "headers": ["Area", "Completion test"], "rows": [["Owner time", "Do / Delegate / Delete decisions are visible; EA or coordinator follow-up is working."], ["Governance", "November plan, 12-week commitments and monthly OOO board rhythm are scheduled."], ["Top clients", "Top 20% by rupee GP have a named relationship owner and service-recovery plan."]], "text": "Area Completion test Owner time Do / Delegate / Delete decisions are visible; EA or coordinator follow-up is working. Governance November plan, 12-week commitments and monthly OOO board rhythm are scheduled. Top clients Top 20% by rupee GP have a named relationship owner and service-recovery plan."}, {"type": "h", "text": "DO LESS. FLOW BETTER. ROTATE FASTER."}, {"type": "p", "text": "The purpose of every tool is a better decision, a stronger system and more freedom for the owner."}, {"type": "p", "text": "Educational note These notes summarise the course session and its implementation examples. Adapt formulas, inventory rules and management targets to the business's accounting method, demand pattern, regulation and risk profile."}], "revisions": []};</script><script>'use strict';

const recall=[['Why cut the task list three times?','To narrow attention from 100 tasks to 20, then 4, then the one decisive action. The result shares are a Pareto illustration, not a promise.'],['Where should the team improve first?','At the current system constraint. Exploit its existing capacity, align the rest of the flow to it, then elevate it if needed. Find the next constraint when it moves.'],['Why isn’t high GP percentage enough?','Read margin rate together with rupee gross profit, inventory turns and ageing. Also check demand, payment quality, risk and cost to serve.'],['What do red and purple inventory mean?','Red flags availability risk for required items. Purple flags excess or non-moving stock. Red needs a service-protection action; purple needs an exit decision and cash-release follow-through.'],['What makes delegation complete?','A clear result, context, appropriate authority, a usable method where needed, evidence of completion and a scheduled review.']];

page('The visual chapter',`${eyebrow('WEEK 15 · FOCUS, FLOW & FREEDOM')}<h1>Do less.<br>Grow more.<br><em>Live better.</em></h1><p class="lead">Find the one thing that changes the many. Then build the systems that give your time back.</p><div class="hero-meta"><span>28 October 2026</span><span>Learn · play · apply</span></div><button class="primary" data-jump="1">Step into the chapter ↗</button><p class="small" style="margin-top:18px">A fresh visual treatment of one chapter.<br>Tap the diagrams as you read.</p>`,'hero-page'),
page('The big picture',`${eyebrow('01 / CONNECT THE IDEAS')}<h2>A stronger business.<br>A lighter <span class="brush">day.</span></h2><p class="body-copy">The lesson connects five ideas. Choose where your attention goes, make work flow, protect the profit engines, release blocked cash, and build a team that can act.</p><div class="pullquote">“More activity” isn’t the finish line.<br><mark>Better results are.</mark></div>${tip('THE CHAPTER IN ONE BREATH','Find the one → fix the flow → protect profit → release cash → buy back time.')}<p class="small">Keep the whole chain in mind. A useful system connects priorities, people, evidence and decisions.</p>`),
page('The big picture',`${eyebrow('THE FIVE-PART GROWTH PATH')}<h2>One idea leads<br>to the next.</h2><div class="journey">${[['Focus','Choose the work that changes the result.'],['Flow','Remove the step that holds everything back.'],['Profit','Give the best products and clients attention.'],['Cash','Keep useful stock moving; release excess.'],['Freedom','Delegate outcomes and review exceptions.']].map(([h,p],i)=>`<div class="journey-step"><span class="step-num">${i+1}</span><div><strong>${h}</strong><p>${p}</p></div></div>`).join('')}</div><p class="small">The business becomes easier to lead when the pieces work together.</p>`,'tint-lime'),
page('Focus on the vital few',`${eyebrow('02 / THE SCIENCE OF FOCUS')}<h2>A hundred tasks.<br>One <mark>real priority.</mark></h2><p class="body-copy">Start with the full task list. Apply the 80/20 lens, then apply it again. Choose the one action that makes other work easier or unnecessary.</p>${tip('TRY THIS BEFORE OPENING MESSAGES','Write: “If I complete only one meaningful thing today, it will be…” Then reserve a real calendar block.','lavender')}<div class="mini-grid">${[['↗','Business','Which decision changes the result?'],['◈','Wealth','Which disciplined action matters?'],['☀','Health','Which habit protects my energy?'],['♡','Relationships','Which conversation deserves time?']].map(([i,h,p])=>`<div class="mini-card"><span class="symbol">${i}</span><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>`),
page('Focus on the vital few',`${eyebrow('PLAY WITH THE IDEA')}<h2>Keep narrowing<br>the <span class="brush">lens.</span></h2><p class="small">Tap a level to see what the classroom illustration is teaching.</p><div class="pyramid">${[[1,'The one thing'],[4,'The decisive few'],[20,'The vital few'],[100,'Everything on the list']].map(([n,s],i)=>`<button data-pyramid="${i}" aria-pressed="${state.pyramid===i}"><span class="n">${n}</span><span class="caption">${s}</span></button>`).join('')}</div><div class="diagram-caption" id="pyramidCaption" aria-live="polite"></div><p class="small" style="margin-top:16px">Illustrative Pareto cuts: about 80%, then 64%, then roughly half the result. These are a thinking aid, not guaranteed results.</p>`,'tint-purple'),
page('Find the constraint',`${eyebrow('03 / IMPROVE THE WHOLE FLOW')}<h2>Busy everywhere.<br>Stuck <mark>somewhere.</mark></h2><p class="body-copy">A process can move only as fast as its limiting step. Improving a different department may simply create a bigger queue.</p><ol class="timeline-list">${[['Identify','Name the current constraint using evidence.'],['Exploit','Protect its time and remove avoidable delays.'],['Subordinate','Align other work to its pace.'],['Elevate','Add capability when the evidence supports it.'],['Repeat','Find the new constraint after the old one moves.']].map(([a,b],i)=>`<li><b>${i+1}</b><span><strong>${a}</strong>${b}</span></li>`).join('')}</ol>${tip('A SMART FIRST MOVE','Watch the queue before buying another machine. Missing inputs, interruptions or unnecessary approvals may be the real problem.','mint')}`),
page('Find the constraint',`${eyebrow('A TINY CAPACITY EXPERIMENT')}<h2>Where is the<br>bottleneck <span class="brush">now?</span></h2><p class="small">Move the middle step’s capacity. See what changes for the whole process.</p><div class="factory" id="factory"></div><label class="control-label" for="capacity">Middle-step capacity: <output id="capacityValue">6</output> jobs/hour</label><input class="range" id="capacity" type="range" min="2" max="16" step="1" value="${state.capacity}"><div class="throughput"><b id="throughput">6</b><span>jobs/hour<br>maximum system capacity in this illustration</span></div><div class="diagram-caption" id="constraintCaption" aria-live="polite"></div><p class="small" style="margin-top:15px">Assumes enough demand and ready inputs. Real output also depends on quality, downtime and handoffs.</p>`,'tint-peach'),
page('Build systems people can run',`${eyebrow('04 / MAKE THE WORK VISIBLE')}<h2>Two tools.<br>Different <mark>jobs.</mark></h2><div class="compare-card"><span class="tag">FOR MULTI-STEP WORK</span><h3>The FMS</h3><p>One live record follows a transaction through the process: trigger, owner, due date, completion evidence and next step.</p><p><b>Example:</b> an order moves from acceptance to planning, execution and customer acceptance.</p></div><div class="compare-card purple"><span class="tag">FOR REPEATED STANDARDS</span><h3>The checklist</h3><p>One clear checkpoint repeats at a time or event, with a doer, an answer, evidence and an exception action.</p><p><b>Example:</b> a daily stock check or a recurring dispatch-quality check.</p></div><p class="small">The Week 15 starting point: two useful FMS and two useful checklists, tested on real work.</p>`),
page('Build systems people can run',`${eyebrow('GIVE EACH ROLE A CLEAR JOB')}<h2>People keep<br>the system <span class="brush">alive.</span></h2><div>${[['DOER','Does the work','Owns the committed result and records evidence.'],['PC','Keeps follow-up moving','Checks exceptions, follows up politely and escalates.'],['MIS','Keeps the system usable','Builds and maintains the operating information.'],['MDO','Removes the obstacle','Makes decisions beyond the doer’s authority.']].map(([b,h,p])=>`<div class="role-row"><span class="role-badge">${b}</span><p><b>${h}</b><br>${p}</p></div>`).join('')}</div>${tip('THE S30 HABIT','Open the live exceptions. Ask what is overdue, what evidence is missing and what decision is needed. Record an owner and the next commitment.','lavender')}<p class="small">The coordinator supports accountability; they do not become the doer for every overdue task.</p>`,'tint-sky'),
page('Protect the profit engines',`${eyebrow('05 / SEE THE WHOLE ECONOMIC PICTURE')}<h2>Pretty margins<br>aren’t the <mark>whole story.</mark></h2><p class="body-copy">A high GP percentage can look exciting while very little profit is created or cash stays trapped in slow stock. Read all four lenses together.</p><div class="lens-tabs">${['GP %','Rupee GP','Turns','Ageing'].map((s,i)=>`<button data-lens="${i}" aria-pressed="${state.lens===i}">${s}</button>`).join('')}</div><div class="lens-panel" id="lensPanel" aria-live="polite"></div><p class="small" style="margin-top:18px">Turns must use the same cost basis in both annual consumption and average inventory.</p>`),
page('Protect the profit engines',`${eyebrow('TURN INSIGHT INTO A DECISION')}<h2>Which products<br>deserve <span class="brush">attention?</span></h2><p class="small">Tap a quadrant to explore the first management question.</p><div class="profit-matrix">${[['HIGH GP · HIGH TURNS','Protect & grow','Healthy contribution, moving capital.'],['HIGH GP · LOW TURNS','Release capital','Strong profit, slow recycling.'],['LOW GP · HIGH TURNS','Improve the mix','Fast activity, weak contribution.'],['LOW GP · LOW TURNS','Challenge the tail','Complexity with cash tied up.']].map(([s,h,p],i)=>`<button class="quadrant" data-matrix="${i}" aria-pressed="${state.matrix===i}">${s}<b>${h}</b>${p}</button>`).join('')}</div><div class="diagram-caption" id="matrixCaption" aria-live="polite"></div><p class="small" style="margin-top:14px">Keep three rankings: oldest stock, highest rupee GP, and highest GP percentage. They answer different questions.</p>`,'tint-lime'),
page('Free the cash in inventory',`${eyebrow('06 / BALANCE SERVICE AND CASH')}<h2>The right stock.<br>For the <mark>right reason.</mark></h2><p class="body-copy">Use the IMS maximum level as a management control. Revisit the inputs every fifteen days as demand and actual lead times change.</p><div class="formula"><span class="micro">ILLUSTRATIVE INPUTS · TRY CHANGING THEM</span><div class="formula-fields"><div><label for="consumption">Daily use</label><input id="consumption" type="number" min="0" max="1000000" step="1" value="${state.consumption}"><small>units / day</small></div><div><label for="lead">Lead time</label><input id="lead" type="number" min="0" max="1000" step="1" value="${state.lead}"><small>days</small></div><div><label for="safety">Safety factor</label><input id="safety" type="number" min="0" max="10" step="0.1" value="${state.safety}"><small>approved buffer</small></div></div><div class="formula-result"><span>ILLUSTRATIVE MAXIMUM<br>daily use × lead time × safety factor</span><output id="stockMaximum" aria-live="polite">750</output></div></div>${tip('A CONTROL, NOT A PURCHASE ORDER','Check usable stock, open orders, reservations, demand, minimum order quantities, supplier reliability and cash before buying.','mint')}`),
page('Free the cash in inventory',`${eyebrow('TWO COLOURS. TWO DIFFERENT ACTIONS.')}<h2>Red protects service.<br>Purple releases <span class="brush">cash.</span></h2><div class="inventory-choice"><div class="inventory-card"><span class="status">● RED / AVAILABILITY RISK</span><h3>“Will we run out?”</h3><p>Validate demand and usable stock. Check incoming supply, actual lead time and the promised receipt date.</p><p><b>Action:</b> replenish, expedite, substitute or correct the data.</p></div><div class="inventory-card purple"><span class="status">◆ PURPLE / EXCESS OR NON-MOVING</span><h3>“Why is cash stuck?”</h3><p>Check age and last use. Choose a credible return, transfer, bundle, discount, recycle or scrap route.</p><p><b>Action:</b> name an owner and due date; track cash actually released.</p></div></div><p class="small">Colour is only a signal. A completed action is the result.</p>`,'tint-purple'),
page('Buy back the owner’s time',`${eyebrow('07 / BUILD CAPABILITY, NOT DEPENDENCE')}<h2>Give the team<br>room to <mark>grow.</mark></h2><p class="body-copy">Good delegation transfers an outcome with enough context and authority to achieve it. It is a design discipline.</p><div class="delegation-recipe">${[['Result','What does done look like?'],['Context','Why does this matter?'],['Authority','What may the doer decide?'],['Method','Which standard or process applies?'],['Evidence','How will completion be verified?'],['Review','When do we check and escalate?']].map(([a,b])=>`<div class="recipe-piece"><b>${a}</b><p>${b}</p></div>`).join('')}</div><div class="pullquote">Your real work:<br>direction, people, capital<br>and the next constraint.</div>`,'dark-page'),
page('Buy back the owner’s time',`${eyebrow('GIVE THE BEST RELATIONSHIPS ATTENTION')}<h2>Care that feels<br><span class="brush">personal.</span></h2><div class="customer-orbit"><div class="core">Your best<br>clients</div><span class="orbit-note">Profitable contribution</span><span class="orbit-note">Payment quality</span><span class="orbit-note">Strategic fit</span><span class="orbit-note">Growth potential</span></div><p class="body-copy">Identify the top clients using economics and relationship quality—not turnover alone. Include service effort and concentration risk.</p>${tip('THE AMEX-STYLE SERVICE IDEA','Remember the promise. Update before they ask. Bring a relevant idea. Own a failure quickly. Follow through consistently.','lavender')}<p class="small">Exceptional care is relevance, reliability and proactive communication, repeated.</p>`),
page('Make progress repeatable',`${eyebrow('08 / CREATE A RHYTHM YOU CAN KEEP')}<h2>A short horizon.<br>A visible <mark>next step.</mark></h2><p class="body-copy">Choose one to three measurable 12-week outcomes. Connect them to weekly leading actions, owners and an honest score.</p><div class="rhythm">${[['Daily','Protect the One Thing. Review live exceptions through S30.'],['Weekly','Score the actions you committed to. Decide what needs recovery.'],['15 days','Recheck IMS demand, actual lead time, safety factors and action queues.'],['Monthly','Review profit, cash, delivery, systems, people and next month’s priorities.']].map(([a,b])=>`<div class="rhythm-row"><b>${a}</b><span>${b}</span></div>`).join('')}</div>${tip('MAKE THE PLAN REAL','A target needs a calendar, a named owner, a definition of done and a place to review the evidence.','mint')}`,'tint-sky'),
page('Make progress repeatable',`${eyebrow('THE SEVEN-DAY IMPLEMENTATION SPRINT')}<h2>Small wins.<br><span class="brush">Real momentum.</span></h2><div class="sprint">${[['Choose','Two FMS, two checklists and one priority.'],['Launch','Agree triggers, owners, evidence and authority.'],['Rank','Prepare ageing, rupee-GP and GP-% lists.'],['Observe','Measure the current constraint.'],['Release','Approve red and purple inventory actions.'],['Plan','Connect the month to a 12-week result.'],['Connect','Choose priority clients and delegate one recurring owner task.']].map(([a,b],i)=>`<div class="day"><span class="day-no">DAY ${i+1}</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}</div><p class="small">Aim for a small working version. Improve it from real exceptions.</p>`),
page('Revision garden',`${eyebrow('09 / LET THE IDEAS TAKE ROOT')}<h2>Close the notes.<br>What <mark>stayed?</mark></h2><p class="small">Try an answer from memory before opening each card.</p>${recall.map(([q,a])=>`<details class="flashcard"><summary>${q}</summary><p>${a}</p></details>`).join('')}<p class="small" style="margin-top:18px">Explain one idea to a teammate. A simple explanation reveals what you really understand.</p>`,'tint-purple'),
page('Revision garden',`${eyebrow('ONE SMALL COMMITMENT')}<h2>The next chapter<br>is <span class="brush">yours.</span></h2><p class="body-copy">Choose the one improvement that deserves attention now. Turn insight into a visible commitment.</p>${['I have chosen and scheduled my One Thing.','I can name the current flow constraint.','My first two FMS and checklists have real owners.','Red and purple stock have actions and review dates.','One recurring owner task is ready to delegate.'].map((t,i)=>`<label class="action-check"><input type="checkbox" data-check="${i}" ${stored.checks?.[i]?'checked':''}><span>${t}</span></label>`).join('')}<label class="micro" for="reflection" style="margin-top:23px">MY ACTION · OWNER · DUE DATE · EVIDENCE</label><textarea id="reflection" class="reflection" placeholder="This week, I will…"></textarea><p class="small" style="margin-top:8px">Your reflection stays in this browser.</p>`)
];
const names=['A new chapter begins','The five-part growth path','Find the one thing','Find the bottleneck','Give systems a team','See profit clearly','Release blocked cash','Buy back your time','A week of small wins','Revise & put it to work'];
const max=pages.length/2-1;let current=Math.min(max,Math.max(0,Number(location.hash.match(/^#spread-(\d+)$/)?.[1]||0)));
function renderPage(p,i){return `<article class="page ${p.cls}">${p.html}${p.cls==='art-page'?'':foot(i+1,p.topic)}</article>`}
function render(){
 $('#spread').innerHTML=pages.slice(current*2,current*2+2).map((p,i)=>renderPage(p,current*2+i)).join('');$('#chapterName').textContent='WEEK 15 / '+names[current].toUpperCase();$('#pageLabel').textContent=`${String(current+1).padStart(2,'0')} / ${String(max+1).padStart(2,'0')} SPREADS`;$('#dots').innerHTML=names.map((n,i)=>`<button class="${i===current?'current':''}" data-jump="${i}" aria-label="Go to ${esc(n)}" ${i===current?'aria-current="step"':''}></button>`).join('');$('#previous').disabled=current===0;$('#next').disabled=current===max;history.replaceState(null,'','#spread-'+current);document.title=names[current]+' · Week 15 · The Business Garden';updateDiagrams();if($('#reflection'))$('#reflection').value=stored.reflection||'';
}
function go(index){let next=Math.max(0,Math.min(max,index));if(next===current)return;let direction=next-current,old=$('#spread').children[direction>0?1:0]?.cloneNode(true);current=next;render();if(old){const leaf=document.createElement('div');leaf.className='turn-leaf'+(direction<0?' reverse':'');leaf.setAttribute('aria-hidden','true');leaf.inert=true;leaf.appendChild(old);$('#book').appendChild(leaf);setTimeout(()=>leaf.remove(),550)}window.scrollTo({top:0,behavior:'instant'})}
function updateDiagrams(){
 const pyramidText=[['One decisive action · roughly half the illustrated result','Protect the calendar block. Let lower-value work follow the priority.'],['Four high-leverage tasks · about 64%','This is the most valuable subset of the vital few. Now choose the one to do first.'],['Twenty vital tasks · about 80%','Rank by the result expected, not just urgency or familiarity.'],['One hundred tasks · the starting universe','Capture everything first. Then delegate, defer, batch, systemise or stop what is not the priority.']];
 if($('#pyramidCaption')){$('#pyramidCaption').innerHTML=`<strong>${pyramidText[state.pyramid][0]}</strong>${pyramidText[state.pyramid][1]}`;document.querySelectorAll('[data-pyramid]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.pyramid)===state.pyramid))}
 if($('#factory')){const rates=[12,state.capacity,10],rate=Math.min(...rates),which=rates.map((v,i)=>v===rate?['Prepare','Process','Deliver'][i]:null).filter(Boolean).join(' & ');$('#factory').innerHTML=rates.map((v,i)=>`<div class="station ${v===rate?'constraint':''}"><span class="machine">${['▤','⚙','↗'][i]}</span><span class="station-name">${['PREPARE','PROCESS','DELIVER'][i]}</span><span class="capacity">${v}</span><small>jobs / hour</small></div>`).join('');$('#capacityValue').textContent=state.capacity;$('#throughput').textContent=rate;$('#constraintCaption').innerHTML=`<strong>${which} ${which.includes('&')?'limit':'limits'} the flow.</strong>${state.capacity<10?'Raising the middle step lifts total capacity. Extra work at the other steps would only create waiting.':state.capacity===10?'Two steps now share the same limit. Protect both and examine the next useful improvement.':'The constraint has moved to delivery. More middle-step capacity alone will not lift the whole flow.'}`}
 const lenses=[['%','GP percentage','The margin rate: how much gross profit is earned per rupee of sales? A high rate on a tiny or slow product may contribute little.'],['₹','Rupee gross profit','The total contribution: which products or clients create the gross-profit rupees that fund the business?'],['↻','Inventory turns','The speed of reuse: how often does average inventory investment rotate on a consistent cost basis?'],['◷','Ageing & movement','The cash reality: is stock being used, and are receivables moving within their agreed time?']];
 if($('#lensPanel')){const [i,h,p]=lenses[state.lens];$('#lensPanel').innerHTML=`<div class="lens-symbol">${i}</div><h3>${h}</h3><p>${p}</p>`;document.querySelectorAll('[data-lens]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.lens)===state.lens))}
 const matrixText=[['Protect the engine','Check availability, quality, capacity and service. Grow deliberately while watching demand and customer risk.'],['Make the same capital work harder','Reduce batch size, lead time and ageing. Check whether high contribution is being held back by a capital-heavy flow.'],['Improve contribution per unit of effort','Examine price, product mix, cross-sell and operating complexity. Fast movement alone is not the finish line.'],['Ask why the complexity deserves to stay','Consider an exit, simplification or redesign. Retain only for a clear strategic reason.']];
 if($('#matrixCaption')){$('#matrixCaption').innerHTML=`<strong>${matrixText[state.matrix][0]}</strong>${matrixText[state.matrix][1]}`;document.querySelectorAll('[data-matrix]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.matrix)===state.matrix))}
 if($('#stockMaximum'))$('#stockMaximum').textContent=(state.consumption*state.lead*state.safety).toLocaleString(undefined,{maximumFractionDigits:1});
}
function openDrawer(title,html){$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=html;$('#shade').hidden=false;$('#drawer').hidden=false;$('#closeDrawer').focus()}
function closeDrawer(){$('#drawer').hidden=true;$('#shade').hidden=true}
function referenceHTML(b){if(b.type==='h')return `<h3>${esc(b.text)}</h3>`;if(b.type==='table')return `<table><thead><tr>${b.headers.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(t=>`<td>${esc(t)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;return `<p class="${b.type==='callout'?'original-callout':''}">${esc(b.text)}</p>`}
$('#jumpBtn').onclick=()=>openDrawer('Follow your curiosity',`<p class="small">Ten visual spreads. One connected lesson.</p>${names.map((n,i)=>`<button class="jump-link" data-jump="${i}"><small>SPREAD ${String(i+1).padStart(2,'0')}</small>${n}</button>`).join('')}`);
$('#notesBtn').onclick=()=>openDrawer('A little deeper',`<p class="small">The detailed Week 15 lesson remains available here. Use the illustrated spreads to learn the structure, then return to a specific explanation or example.</p><div class="reference">${CHAPTER.blocks.map(referenceHTML).join('')}</div>`);
$('#closeDrawer').onclick=closeDrawer;$('#shade').onclick=closeDrawer;$('#previous').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);
let large=false;$('#typeBtn').onclick=()=>{large=!large;document.documentElement.style.setProperty('--body-size',large?'20px':'17px');$('#typeBtn').setAttribute('aria-pressed',large)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.jump!==undefined){closeDrawer();go(Number(b.dataset.jump))}for(const name of ['pyramid','lens','matrix'])if(b.dataset[name]!==undefined){state[name]=Number(b.dataset[name]);updateDiagrams()}});
document.addEventListener('input',e=>{if(['capacity','consumption','lead','safety'].includes(e.target.id)){let v=Number(e.target.value);if(Number.isFinite(v)&&v>=0){state[e.target.id]=v;updateDiagrams()}}if(e.target.id==='reflection'){stored.reflection=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){stored.checks=stored.checks||{};stored.checks[e.target.dataset.check]=e.target.checked;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!$('#drawer').hidden)return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
let touch=null;$('#book').addEventListener('touchstart',e=>{if(e.target.closest('input,button,textarea,summary'))return;touch=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});$('#book').addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.6)go(current+(dx<0?1:-1));touch=null},{passive:true});
render();
</script></body></html>
